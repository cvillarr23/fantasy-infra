{{- if .Values.ingress.enabled }}
# The public entry point: TLS terminates at the ingress controller, then oauth2-proxy checks the
# Google login before forwarding to the UI. Everything, including /v1/*, goes through it.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fantasy
  namespace: {{ .Release.Namespace }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ required "ingress.host is required when ingress.enabled is true" .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: oauth2-proxy
                port:
                  number: 4180
{{- end }}
