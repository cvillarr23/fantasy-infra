# The launcher creates and deletes Jobs and watches their pods, in this namespace only.
# RBAC can't scope `create` by resourceNames (see core-pipeline/rbac.yaml), and Job names
# are generated per run, so the Job rules are namespace-wide. Its replicas elect a leader
# over the `fantasy-job-launcher` Lease (core's src/launcher/leader.py): reads and writes are
# scoped to that one Lease, and only its first creation needs the namespace-wide `create`.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fantasy-job-launcher
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: fantasy-job-launcher
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    resourceNames: ["fantasy-job-launcher"]
    verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fantasy-job-launcher
  namespace: {{ .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: fantasy-job-launcher
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: fantasy-job-launcher
  apiGroup: rbac.authorization.k8s.io
