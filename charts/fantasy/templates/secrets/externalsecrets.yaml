{{- /*
With secrets.provider=externalSecrets, External Secrets Operator fills every Secret the
workloads reference from one secret store. Each ExternalSecret renders only when its store path
is set in secrets.externalSecrets.remoteKeys. Property names inside each path are fixed; the
chart README lists them. Lines such as {{ `{{ .username }}` }} are ESO templates passed through
verbatim.
*/}}
{{- if eq .Values.secrets.provider "externalSecrets" }}
{{- $es := .Values.secrets.externalSecrets }}
{{- $keys := $es.remoteKeys }}
{{- $ns := .Release.Namespace }}
{{- $store := dict "name" (required "secrets.externalSecrets.storeRef.name is required" $es.storeRef.name) "kind" $es.storeRef.kind }}
{{- with $keys.postgres }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: database-credentials
  namespace: {{ $ns }}
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef:
    {{- toYaml $store | nindent 4 }}
  target:
    name: database-credentials
  data:
    - secretKey: postgres-password
      remoteRef:
        key: {{ . }}
        property: postgres-password
{{- end }}
{{- with $keys.postgresReadonly }}
---
# Password for the read-only grafana_reader Postgres role, provisioned by
# databases/postgres-readonly-role-job.yaml for a Grafana datasource.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: readonly-database-credentials
  namespace: {{ $ns }}
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef:
    {{- toYaml $store | nindent 4 }}
  target:
    name: readonly-database-credentials
  data:
    - secretKey: readonly-password
      remoteRef:
        key: {{ . }}
        property: readonly-password
{{- end }}
{{- if $keys.espn }}
---
# The ESPN session cookies plus the league and team IDs. Runtime draft Jobs inherit this Secret
# along with the shared ConfigMap.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: espn-session-secrets
  namespace: {{ $ns }}
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef:
    {{- toYaml $store | nindent 4 }}
  target:
    name: espn-session-secrets
  data:
    - secretKey: espn_s2
      remoteRef:
        key: {{ $keys.espn }}
        property: espn_s2
    - secretKey: swid
      remoteRef:
        key: {{ $keys.espn }}
        property: swid
    - secretKey: ESPN_LEAGUE_ID
      remoteRef:
        key: {{ required "secrets.externalSecrets.remoteKeys.deployment is required with espn" $keys.deployment }}
        property: ESPN_LEAGUE_ID
    - secretKey: ESPN_TEAM_ID
      remoteRef:
        key: {{ $keys.deployment }}
        property: ESPN_TEAM_ID
{{- end }}
{{- with $keys.espnSessionState }}
---
# The full Playwright storageState (cookies + localStorage) that remote_login.js writes after a
# real login. Rendered ESPN pages (the trade builder) are unreliable with espn_s2/SWID alone.
# Separate from espn-session-secrets so a missing key here can't break cookie auth, and mounted
# optional, so workers fall back to cookies without it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: espn-session-state
  namespace: {{ $ns }}
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef:
    {{- toYaml $store | nindent 4 }}
  target:
    name: espn-session-state
  data:
    - secretKey: state.json
      remoteRef:
        key: {{ . }}
        property: state
{{- end }}
{{- with $keys.triggerApiKey }}
---
# Shared secret guarding core-pipeline's /v1/trigger/* routes, which cause real ESPN side
# effects and are called in-cluster, bypassing oauth2-proxy.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: trigger-api-key
  namespace: {{ $ns }}
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef:
    {{- toYaml $store | nindent 4 }}
  target:
    name: trigger-api-key
  data:
    - secretKey: trigger-api-key
      remoteRef:
        key: {{ . }}
        property: trigger_api_key
{{- end }}
{{- with $keys.groq }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: groq-api-key
  namespace: {{ $ns }}
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef:
    {{- toYaml $store | nindent 4 }}
  target:
    name: groq-api-key
  data:
    - secretKey: groq_api_key
      remoteRef:
        key: {{ . }}
        property: groq_api_key
{{- end }}
{{- with $keys.gemini }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gemini-api-key
  namespace: {{ $ns }}
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef:
    {{- toYaml $store | nindent 4 }}
  target:
    name: gemini-api-key
  data:
    - secretKey: gemini_api_key
      remoteRef:
        key: {{ . }}
        property: gemini_api_key
{{- end }}
{{- with $keys.rabbitmq }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rabbitmq-credentials
  namespace: {{ $ns }}
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef:
    {{- toYaml $store | nindent 4 }}
  target:
    name: rabbitmq-credentials
    template:
      engineVersion: v2
      mergePolicy: Merge
      data:
        # Composed connection string so consumers (app env, KEDA trigger auth)
        # don't each need to reassemble it from the raw user/password fields.
        # Default vhost must be the percent-encoded "%2f", not a bare trailing "/" -
        # a bare "//" parses as vhost "" (empty string) in pika and most AMQP clients,
        # not "/", and RabbitMQ then rejects the connection with "vhost  not found".
        amqp-url: 'amqp://{{ `{{ index . "rabbitmq-user" }}` }}:{{ `{{ index . "rabbitmq-password" }}` }}@{{ include "fantasy.svcHost" (list $ "fantasy-broker") }}:5672/%2f'
  data:
    - secretKey: rabbitmq-user
      remoteRef:
        key: {{ . }}
        property: rabbitmq-user
    - secretKey: rabbitmq-password
      remoteRef:
        key: {{ . }}
        property: rabbitmq-password
{{- end }}
{{- with $keys.oauth2Proxy }}
---
# OAuth client credentials and session cookie-signing secret. cookie-secret must be a
# 16/24/32-byte value, base64 URL-safe encoded:
#   openssl rand -base64 32 | tr -- '+/' '-_'
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: oauth2-proxy-credentials
  namespace: {{ $ns }}
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef:
    {{- toYaml $store | nindent 4 }}
  target:
    name: oauth2-proxy-credentials
  data:
    - secretKey: client-id
      remoteRef:
        key: {{ . }}
        property: client-id
    - secretKey: client-secret
      remoteRef:
        key: {{ . }}
        property: client-secret
    - secretKey: cookie-secret
      remoteRef:
        key: {{ . }}
        property: cookie-secret
{{- end }}
{{- with $keys.ghcr }}
---
# A registry pull secret, for installs that pull private images. List it in imagePullSecrets.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr-pull-secret
  namespace: {{ $ns }}
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef:
    {{- toYaml $store | nindent 4 }}
  target:
    name: ghcr-pull-secret
    template:
      type: kubernetes.io/dockerconfigjson
      engineVersion: v2
      data:
        .dockerconfigjson: |
          {{ `{"auths":{"ghcr.io":{"username":"{{ .username }}","password":"{{ .token }}","auth":"{{ printf "%s:%s" .username .token | b64enc }}"}}}` }}
  data:
    - secretKey: username
      remoteRef:
        key: {{ . }}
        property: username
    - secretKey: token
      remoteRef:
        key: {{ . }}
        property: token
{{- end }}
{{- with $keys.oauth2ProxyDeployment }}
---
# Deployment identity stays in the private store; missing fields prevent startup.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: oauth2-proxy-deployment-config
  namespace: {{ $ns }}
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef:
    {{- toYaml $store | nindent 4 }}
  target:
    name: oauth2-proxy-deployment-config
  data:
    - secretKey: authenticated-emails-list
      remoteRef:
        key: {{ . }}
        property: authenticated-emails-list
    - secretKey: redirect-url
      remoteRef:
        key: {{ . }}
        property: redirect-url
    - secretKey: cookie-domain
      remoteRef:
        key: {{ . }}
        property: cookie-domain
{{- end }}
{{- with $keys.ntfy }}
---
# The worker's write-only ntfy token. Read through envFrom, so the key is the env var name.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ntfy-credentials
  namespace: {{ $ns }}
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef:
    {{- toYaml $store | nindent 4 }}
  target:
    name: ntfy-credentials
  data:
    - secretKey: NTFY_TOKEN
      remoteRef:
        key: {{ . }}
        property: token
{{- end }}
{{- end }}
