{{- /*
Credentials Argo CD Image Updater needs in the argocd namespace, from the same secret store as
the app Secrets: a GHCR pull secret to read digests, a deploy key to commit them back, and an
Argo CD repository credential built from that key.
*/}}
{{- if and .Values.imageUpdater.enabled (eq .Values.secrets.provider "externalSecrets") }}
{{- $es := .Values.secrets.externalSecrets }}
{{- $store := dict "name" $es.storeRef.name "kind" $es.storeRef.kind }}
{{- $gitKey := required "imageUpdater.gitCredentialsKey is required" .Values.imageUpdater.gitCredentialsKey }}
{{- with $es.remoteKeys.ghcr }}
---
# Image Updater reads image tags from GHCR with the same credential as the pods' pull secret,
# as a .dockerconfigjson in the argocd namespace.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr-pull-secret
  namespace: argocd
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef:
    {{- toYaml $store | nindent 4 }}
  target:
    name: ghcr-pull-secret
    template:
      type: kubernetes.io/dockerconfigjson
      engineVersion: v2
      data:
        .dockerconfigjson: |
          {{ `{"auths":{"ghcr.io":{"username":"{{ .username }}","password":"{{ .token }}","auth":"{{ printf "%s:%s" .username .token | b64enc }}"}}}` }}
  data:
    - secretKey: username
      remoteRef:
        key: {{ . }}
        property: username
    - secretKey: token
      remoteRef:
        key: {{ . }}
        property: token
{{- end }}
---
# The deploy key Image Updater commits digest updates with, mounted at /home/argocd/.ssh/id_rsa.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-image-updater-git-credentials
  namespace: argocd
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef:
    {{- toYaml $store | nindent 4 }}
  target:
    name: argocd-image-updater-git-credentials
  data:
    - secretKey: id_rsa
      remoteRef:
        key: {{ $gitKey }}
        property: ssh-private-key
    - secretKey: id_rsa.pub
      remoteRef:
        key: {{ $gitKey }}
        property: ssh-public-key
{{- with .Values.imageUpdater.repoUrl }}
---
# Argo CD repository credential over SSH, built from the same deploy key. The image updater
# writes back with whatever credential Argo CD holds for the Application's repoURL; over HTTPS
# that is the account token, which a branch ruleset may reject for direct pushes, while deploy
# keys can bypass it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: repo-fantasy-infra-ssh
  namespace: argocd
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef:
    {{- toYaml $store | nindent 4 }}
  target:
    name: repo-fantasy-infra-ssh
    template:
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repository
      data:
        type: git
        url: {{ . }}
        sshPrivateKey: {{ `"{{ .sshPrivateKey }}"` }}
  data:
    - secretKey: sshPrivateKey
      remoteRef:
        key: {{ $gitKey }}
        property: ssh-private-key
{{- end }}
{{- end }}
