name: Job catalog
on:
  pull_request:
    paths:
      - 'charts/fantasy/files/catalog.yaml'
      - 'charts/fantasy/files/telemetry/launcher-run-failed-*-alert.yaml'
      - 'scripts/generate-launcher-alerts.py'
      - 'charts/fantasy/templates/launcher/deployment.yaml'
      - 'charts/fantasy/values-images.yaml'
      - '.github/workflows/job-catalog.yml'
  push:
    branches: [main]
    paths:
      - 'charts/fantasy/files/catalog.yaml'
      - 'charts/fantasy/files/telemetry/launcher-run-failed-*-alert.yaml'
      - 'scripts/generate-launcher-alerts.py'
      - 'charts/fantasy/templates/launcher/deployment.yaml'
      - 'charts/fantasy/values-images.yaml'
      - '.github/workflows/job-catalog.yml'
# The catalog is validated by the core image the production launcher is pinned to (the digest
# argocd-image-updater writes to charts/fantasy/values-images.yaml), so it passes only if the launcher that
# will load it accepts it. A catalog using a new core field fails here until an image with that
# field is deployed, rather than crash-looping the launcher. Image bumps rerun it on main.
# Pulling the private package needs fantasy-infra granted read access in its package settings.
permissions:
  contents: read
  packages: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: 'v3.19.0'
      - run: pip install check-jsonschema PyYAML
      - name: Find the production launcher image
        run: |
          image=$(helm template fantasy-infra charts/fantasy -n default \
            -f charts/fantasy/values-production.yaml -f charts/fantasy/values-images.yaml \
            | python3 scripts/launcher-image.py)
          echo "Validating against $image"
          echo "LAUNCHER_IMAGE=$image" >> "$GITHUB_ENV"
      - name: Pull it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker pull --quiet "$LAUNCHER_IMAGE"
      # The JSON schema catches structure; core's own check adds the rules pydantic enforces
      # that the schema can't express (references between jobs, profiles and chains).
      - name: Validate with the launcher's own schema and check
        run: |
          docker run --rm --network none "$LAUNCHER_IMAGE" python -m src.launcher.catalog --json-schema > "$RUNNER_TEMP/catalog-schema.json"
          check-jsonschema --schemafile "$RUNNER_TEMP/catalog-schema.json" charts/fantasy/files/catalog.yaml
          docker run --rm --network none -v "$PWD/charts/fantasy/files:/catalog:ro" "$LAUNCHER_IMAGE" python -m src.launcher.catalog --check /catalog/catalog.yaml
      - name: Generated alert rules match the catalog
        run: python3 scripts/generate-launcher-alerts.py --check
