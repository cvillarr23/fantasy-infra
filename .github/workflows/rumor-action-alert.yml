name: Rumor action alert
on:
  pull_request:
    paths:
      - base/telemetry/rumor-action-outcome-alert.yaml
      - tests/rumor_action_alert/**
      - .github/workflows/rumor-action-alert.yml
permissions:
  contents: read

jobs:
  sql:
    runs-on: fantasy-runners
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: pip install PyYAML
      - run: ./tests/rumor_action_alert/run.sh
