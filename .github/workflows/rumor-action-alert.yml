name: Rumor action alert
on:
  pull_request:
    paths:
      - base/telemetry/rumor-action-outcome-alert.yaml
      - tests/rumor_action_alert/**
      - .github/workflows/rumor-action-alert.yml
permissions:
  contents: read

jobs:
  sql:
    runs-on: fantasy-runners
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - run: pip install PyYAML
      - run: ./tests/rumor_action_alert/run.sh
