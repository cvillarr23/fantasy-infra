name: CronJob alerts
on:
  pull_request:
    paths:
      - 'base/telemetry/**'
      - 'base/core-pipeline/fantasy-cronjob-health-dashboard.yaml'
      - 'base/core-pipeline/*cronjob.yaml'
      - 'base/browser-worker/*cronjob.yaml'
      - 'tests/cronjob_alerts/**'
      - '.github/workflows/cronjob-alerts.yml'
  push:
    branches: [main]
    paths:
      - 'base/telemetry/**'
      - 'base/core-pipeline/fantasy-cronjob-health-dashboard.yaml'
      - 'base/core-pipeline/*cronjob.yaml'
      - 'base/browser-worker/*cronjob.yaml'
      - 'tests/cronjob_alerts/**'
      - '.github/workflows/cronjob-alerts.yml'
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - run: pip install PyYAML
      - run: ./tests/cronjob_alerts/run.sh
