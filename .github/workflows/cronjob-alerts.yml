name: CronJob alerts
on:
  pull_request:
    paths:
      - 'base/telemetry/**'
      - 'base/core-pipeline/fantasy-cronjob-health-dashboard.yaml'
      - 'base/core-pipeline/*cronjob.yaml'
      - 'base/browser-worker/*cronjob.yaml'
      - 'tests/cronjob_alerts/**'
      - '.github/workflows/cronjob-alerts.yml'
  push:
    branches: [main]
    paths:
      - 'base/telemetry/**'
      - 'base/core-pipeline/fantasy-cronjob-health-dashboard.yaml'
      - 'base/core-pipeline/*cronjob.yaml'
      - 'base/browser-worker/*cronjob.yaml'
      - 'tests/cronjob_alerts/**'
      - '.github/workflows/cronjob-alerts.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install PyYAML
      - run: ./tests/cronjob_alerts/run.sh
