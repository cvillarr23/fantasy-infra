name: CronJob alerts
on:
  pull_request:
    paths:
      - 'base/telemetry/**'
      - 'base/core-pipeline/fantasy-cronjob-health-dashboard.yaml'
      - 'base/core-pipeline/*cronjob.yaml'
      - 'base/browser-worker/*cronjob.yaml'
      - 'tests/cronjob_alerts/**'
      - '.github/workflows/cronjob-alerts.yml'
  push:
    branches: [main]
    paths:
      - 'base/telemetry/**'
      - 'base/core-pipeline/fantasy-cronjob-health-dashboard.yaml'
      - 'base/core-pipeline/*cronjob.yaml'
      - 'base/browser-worker/*cronjob.yaml'
      - 'tests/cronjob_alerts/**'
      - '.github/workflows/cronjob-alerts.yml'
permissions:
  contents: read

jobs:
  validate:
    runs-on: fantasy-runners
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: pip install PyYAML
      - run: ./tests/cronjob_alerts/run.sh
