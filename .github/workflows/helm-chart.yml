name: Helm chart
on:
  pull_request:
    paths:
      - 'charts/**'
      - 'base/**'
      - 'overlays/**'
      - 'scripts/compare-renders.py'
      - 'tests/test_chart.py'
      - '.github/workflows/helm-chart.yml'
  push:
    branches: [main]
    paths:
      - 'charts/**'
      - 'base/**'
      - 'overlays/**'
      - 'scripts/compare-renders.py'
      - 'tests/test_chart.py'
      - '.github/workflows/helm-chart.yml'
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5.2.0
        with:
          version: 'v1.35.0'
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: 'v3.19.0'
      - run: pip install PyYAML
      - run: helm lint charts/fantasy
      - run: helm lint charts/fantasy -f charts/fantasy/values-production.yaml -f charts/fantasy/values-images.yaml
      - run: python3 -m unittest tests.test_chart
      # Argo CD still deploys the overlays; the chart must render the same objects until it
      # switches. On failure after editing base/, run scripts/sync-chart-files.sh or mirror the
      # change in the chart template.
      - name: Chart render matches the overlays
        run: python3 scripts/compare-renders.py
      - name: Install kubeconform
        run: |
          curl -sSLo "$RUNNER_TEMP/kubeconform.tar.gz" https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz
          echo "9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883  $RUNNER_TEMP/kubeconform.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/kubeconform.tar.gz" -C "$RUNNER_TEMP" kubeconform
      # The self-host defaults, with the optional resources on, against the oldest supported
      # Kubernetes. CRDs (ScaledJob, TriggerAuthentication, ExternalSecret) have no built-in
      # schema and are skipped.
      - name: Rendered manifests are valid Kubernetes objects
        run: |
          helm template fantasy charts/fantasy -n fantasy \
            --set ingress.enabled=true --set ingress.host=draft.example.com \
            --set postgres.readonlyRole.enabled=true --set tailscale.enabled=true \
            | "$RUNNER_TEMP/kubeconform" -strict -summary -ignore-missing-schemas -kubernetes-version 1.27.0

  # Publishes oci://ghcr.io/cvillarr23/charts/fantasy when Chart.yaml's version is new.
  publish:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: 'v3.19.0'
      - name: Push the chart if this version isn't published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^version: *//p' charts/fantasy/Chart.yaml)
          echo "$GH_TOKEN" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          if helm show chart oci://ghcr.io/cvillarr23/charts/fantasy --version "$version" >/dev/null 2>&1; then
            echo "fantasy $version is already published"
            exit 0
          fi
          helm package charts/fantasy -d "$RUNNER_TEMP"
          helm push "$RUNNER_TEMP/fantasy-$version.tgz" oci://ghcr.io/cvillarr23/charts
