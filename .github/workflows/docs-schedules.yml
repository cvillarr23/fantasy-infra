name: Docs schedules
on:
  pull_request:
    paths:
      - 'docs/**'
      - 'base/**'
      - 'overlays/**'
      - 'scripts/generate-schedules.py'
      - '.github/workflows/docs-schedules.yml'
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'base/**'
      - 'overlays/**'
      - 'scripts/generate-schedules.py'
      - '.github/workflows/docs-schedules.yml'
permissions:
  contents: read

jobs:
  inventory:
    runs-on: fantasy-runners
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5.2.0
        with:
          version: 'v1.35.0'
      - run: pip install PyYAML
      - run: python3 scripts/generate-schedules.py --check
