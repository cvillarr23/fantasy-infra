name: Docs schedules
on:
  pull_request:
    paths:
      - 'docs/**'
      - 'base/**'
      - 'overlays/**'
      - 'scripts/generate-schedules.py'
      - '.github/workflows/docs-schedules.yml'
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'base/**'
      - 'overlays/**'
      - 'scripts/generate-schedules.py'
      - '.github/workflows/docs-schedules.yml'
permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - run: pip install PyYAML
      - run: python3 -m unittest tests.test_generate_schedules
      - run: python3 scripts/generate-schedules.py --check
