name: Core pipeline refresh and schedules
on:
  pull_request:
    paths:
      - 'base/core-pipeline/*cronjob.yaml'
      - 'base/core-pipeline/fastapi-deployment.yaml'
      - 'base/browser-worker/trade-scan-cronjob.yaml'
      - 'overlays/**'
      - 'tests/test_draft_prep_refresher.py'
      - 'tests/test_weekly_schedules.py'
      - 'tests/test_weekly_waiver_week.py'
      - 'tests/test_auto_publish_ir_moves.py'
      - '.github/workflows/draft-prep-refresher.yml'
  push:
    branches: [main]
    paths:
      - 'base/core-pipeline/*cronjob.yaml'
      - 'base/core-pipeline/fastapi-deployment.yaml'
      - 'base/browser-worker/trade-scan-cronjob.yaml'
      - 'overlays/**'
      - 'tests/test_draft_prep_refresher.py'
      - 'tests/test_weekly_schedules.py'
      - 'tests/test_weekly_waiver_week.py'
      - 'tests/test_auto_publish_ir_moves.py'
      - '.github/workflows/draft-prep-refresher.yml'
permissions:
  contents: read

jobs:
  validate:
    runs-on: fantasy-runners
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5.2.0
        with:
          version: 'v1.35.0'
      - run: pip install PyYAML
      - run: python -m unittest discover -s tests -p test_draft_prep_refresher.py
      - run: python -m unittest discover -s tests -p test_weekly_schedules.py
      - run: python -m unittest discover -s tests -p test_weekly_waiver_week.py
      - run: python -m unittest discover -s tests -p test_auto_publish_ir_moves.py
