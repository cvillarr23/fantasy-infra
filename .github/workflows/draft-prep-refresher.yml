name: Core pipeline refresh and schedules
on:
  pull_request:
    paths:
      - 'charts/fantasy/**'
      - 'tests/chart_render.py'
      - 'tests/test_weekly_schedules.py'
      - 'tests/test_auto_publish_ir_moves.py'
      - 'tests/test_core_pipeline_probes.py'
      - '.github/workflows/draft-prep-refresher.yml'
  push:
    branches: [main]
    paths:
      - 'charts/fantasy/**'
      - 'tests/chart_render.py'
      - 'tests/test_weekly_schedules.py'
      - 'tests/test_auto_publish_ir_moves.py'
      - 'tests/test_core_pipeline_probes.py'
      - '.github/workflows/draft-prep-refresher.yml'
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: 'v3.19.0'
      - run: pip install PyYAML
      - run: python -m unittest discover -s tests -p test_weekly_schedules.py
      - run: python -m unittest discover -s tests -p test_auto_publish_ir_moves.py
      - run: python -m unittest discover -s tests -p test_core_pipeline_probes.py
