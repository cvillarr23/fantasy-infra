name: Core pipeline refresh and schedules
on:
  pull_request:
    paths:
      - 'base/core-pipeline/*cronjob.yaml'
      - 'base/browser-worker/trade-scan-cronjob.yaml'
      - 'overlays/**'
      - 'tests/test_draft_prep_refresher.py'
      - 'tests/test_weekly_schedules.py'
      - '.github/workflows/draft-prep-refresher.yml'
  push:
    branches: [main]
    paths:
      - 'base/core-pipeline/*cronjob.yaml'
      - 'base/browser-worker/trade-scan-cronjob.yaml'
      - 'overlays/**'
      - 'tests/test_draft_prep_refresher.py'
      - 'tests/test_weekly_schedules.py'
      - '.github/workflows/draft-prep-refresher.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: azure/setup-kubectl@v4
        with:
          version: 'v1.35.0'
      - run: pip install PyYAML
      - run: python -m unittest discover -s tests -p test_draft_prep_refresher.py
      - run: python -m unittest discover -s tests -p test_weekly_schedules.py
