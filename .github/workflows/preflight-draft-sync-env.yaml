name: Preflight Draft Sync Env

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install preflight dependencies
        run: python -m pip install --upgrade pip pyyaml

      - name: Setup kubectl
        uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5.2.0

      - name: Run draft-sync env preflight
        run: ./scripts/preflight-draft-sync-env.sh

      - name: Validate private deployment configuration
        run: python -m unittest discover -s tests -p test_deployment_values.py
