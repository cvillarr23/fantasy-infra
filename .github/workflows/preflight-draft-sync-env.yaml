name: Preflight Draft Sync Env

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install preflight dependencies
        run: python -m pip install --upgrade pip pyyaml

      - name: Setup kubectl
        uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4

      - name: Run draft-sync env preflight
        run: ./scripts/preflight-draft-sync-env.sh

      - name: Validate private deployment configuration
        run: python -m unittest discover -s tests -p test_deployment_values.py
