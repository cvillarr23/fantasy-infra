name: Preflight Draft Sync Env

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install preflight dependencies
        run: python -m pip install --upgrade pip pyyaml

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Run draft-sync env preflight
        run: ./scripts/preflight-draft-sync-env.sh
