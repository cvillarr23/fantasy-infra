name: Preflight Draft Sync Env

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install preflight dependencies
        run: python -m pip install --upgrade pip pyyaml

      - name: Setup Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: 'v3.19.0'

      # The draft-sync env vars this used to check are gone: draft runs go through the job
      # launcher (fantasy-core-pipeline#350). The workflow keeps its name for required checks.
      - name: Render production and draft day
        run: |
          cd charts/fantasy
          helm template fantasy-infra . -n default -f values-production.yaml -f values-images.yaml > /dev/null
          helm template fantasy-infra . -n default -f values-production.yaml -f values-draft-day.yaml \
            -f values-images.yaml > /dev/null

      - name: Validate private deployment configuration
        run: python -m unittest discover -s tests -p test_deployment_values.py
