name: Launcher alerts
on:
  pull_request:
    paths:
      - 'charts/fantasy/**'
      - 'tests/chart_render.py'
      - 'tests/fixtures/job-catalog.yaml'
      - 'tests/launcher_alerts/**'
      - 'tests/test_generate_launcher_alerts.py'
      - 'tests/test_launcher_manifests.py'
      - 'scripts/generate-launcher-alerts.py'
      - '.github/workflows/launcher-alerts.yml'
  push:
    branches: [main]
    paths:
      - 'charts/fantasy/**'
      - 'tests/chart_render.py'
      - 'tests/fixtures/job-catalog.yaml'
      - 'tests/launcher_alerts/**'
      - 'tests/test_generate_launcher_alerts.py'
      - 'tests/test_launcher_manifests.py'
      - 'scripts/generate-launcher-alerts.py'
      - '.github/workflows/launcher-alerts.yml'
permissions:
  contents: read

jobs:
  sql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: 'v3.19.0'
      - run: pip install PyYAML
      - run: python3 -m unittest tests.test_generate_launcher_alerts tests.test_launcher_manifests
      - run: ./tests/launcher_alerts/run.sh
