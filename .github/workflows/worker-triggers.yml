name: Browser worker queue triggers
on:
  pull_request:
    paths:
      - 'base/browser-worker/**'
      - 'base/databases/rabbitmq-deployment.yaml'
      - 'overlays/**'
      - 'tests/test_worker_triggers.py'
      - '.github/workflows/worker-triggers.yml'
  push:
    branches: [main]
    paths:
      - 'base/browser-worker/**'
      - 'base/databases/rabbitmq-deployment.yaml'
      - 'overlays/**'
      - 'tests/test_worker_triggers.py'
      - '.github/workflows/worker-triggers.yml'
permissions:
  contents: read

jobs:
  render:
    runs-on: fantasy-runners
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5.2.0
        with:
          version: 'v1.35.0'
      - run: pip install PyYAML
      - run: python -m unittest discover -s tests -p test_worker_triggers.py
