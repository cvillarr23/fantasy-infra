# promtool unit tests for base/telemetry's alert rules; run via ./run.sh, which
# renders rules.yaml from the committed ConfigMaps (see render_rules.py).
# Series use real epochs. Past Jobs (2026-09-22/29) ran on the old "0 4 * * 2" schedule,
# at 09:00 UTC. Historical failure fixtures retain their original creation times.
# Missed-run DST fixtures use the optimizer's 19:15 America/Chicago schedule.
# kube_job_created's value is the creation time; next_schedule_time is what
# kube-state-metrics reports (it applies spec.timeZone). As on the live cluster, a
# succeeded Job has no kube_job_failed{condition="true"} series at all.
rule_files: [rules.yaml]
evaluation_interval: 1m

tests:
  # Healthy week. The latest optimizer and ingestor Jobs succeeded and the next runs are
  # scheduled. The ingestor also has an older failed Job still in failedJobsHistoryLimit
  # (mirrors the live fantasy-weekly-ingestor-29814240), which must not fire. A zero-swap
  # "already optimal" run produces exactly these series; kube-state-metrics has no swap
  # count, so it can't alert.
  - name: success and zero-swap no-op do not alert
    interval: 1m
    start_timestamp: 1790673000 # 2026-09-29 09:10 UTC, after both runs
    input_series:
      - series: 'kube_job_owner{exported_namespace="default", job_name="fantasy-lineup-optimizer-29834460", owner_kind="CronJob", owner_name="fantasy-lineup-optimizer"}'
        values: '1x10'
      - series: 'kube_job_created{exported_namespace="default", job_name="fantasy-lineup-optimizer-29834460"}'
        values: '1790067600x10'
      - series: 'kube_job_owner{exported_namespace="default", job_name="fantasy-lineup-optimizer-29844540", owner_kind="CronJob", owner_name="fantasy-lineup-optimizer"}'
        values: '1x10'
      - series: 'kube_job_created{exported_namespace="default", job_name="fantasy-lineup-optimizer-29844540"}'
        values: '1790672400x10'
      - series: 'kube_job_owner{exported_namespace="default", job_name="fantasy-weekly-ingestor-29814240", owner_kind="CronJob", owner_name="fantasy-weekly-ingestor"}'
        values: '1x10'
      - series: 'kube_job_created{exported_namespace="default", job_name="fantasy-weekly-ingestor-29814240"}'
        values: '1788854400x10'
      - series: 'kube_job_failed{exported_namespace="default", job_name="fantasy-weekly-ingestor-29814240", condition="true"}'
        values: '1x10'
      - series: 'kube_job_owner{exported_namespace="default", job_name="fantasy-weekly-ingestor-29844480", owner_kind="CronJob", owner_name="fantasy-weekly-ingestor"}'
        values: '1x10'
      - series: 'kube_job_created{exported_namespace="default", job_name="fantasy-weekly-ingestor-29844480"}'
        values: '1790668800x10'
      - series: 'kube_cronjob_next_schedule_time{exported_namespace="default", cronjob="fantasy-lineup-optimizer"}'
        values: '1791282600x10'
      - series: 'kube_cronjob_status_last_successful_time{exported_namespace="default", cronjob="fantasy-lineup-optimizer"}'
        values: '1790672409x10'
      - series: 'kube_cronjob_status_last_successful_time{exported_namespace="default", cronjob="fantasy-weekly-ingestor"}'
        values: '1790668813x10'
    alert_rule_test:
      - eval_time: 5m
        alertname: fantasy-cronjob-job-failed
        exp_alerts: []
      - eval_time: 5m
        alertname: fantasy-cronjob-missed-schedule
        exp_alerts: []
    promql_expr_test:
      # The failed alert's "last successful run" context joins on owner_name.
      - expr: grafana_context:fantasy_cronjob_job_failed:D
        eval_time: 5m
        exp_samples:
          - labels: 'grafana_context:fantasy_cronjob_job_failed:D{exported_namespace="default", owner_name="fantasy-lineup-optimizer"}'
            value: 1790672409
          - labels: 'grafana_context:fantasy_cronjob_job_failed:D{exported_namespace="default", owner_name="fantasy-weekly-ingestor"}'
            value: 1790668813

  # The latest optimizer and ingestor Jobs both failed (for the optimizer, e.g. missing
  # input after fantasy-core-pipeline#178). Each fires with its Job name. A failed
  # CronJob outside the watched set doesn't fire. The runs did happen, so the next
  # schedule advanced and "missed" stays quiet: failed and missed are separate states.
  - name: latest Job failed alerts per CronJob
    interval: 1m
    start_timestamp: 1790673000
    input_series:
      - series: 'kube_job_owner{exported_namespace="default", job_name="fantasy-lineup-optimizer-29834460", owner_kind="CronJob", owner_name="fantasy-lineup-optimizer"}'
        values: '1x10'
      - series: 'kube_job_created{exported_namespace="default", job_name="fantasy-lineup-optimizer-29834460"}'
        values: '1790067600x10'
      - series: 'kube_job_owner{exported_namespace="default", job_name="fantasy-lineup-optimizer-29844540", owner_kind="CronJob", owner_name="fantasy-lineup-optimizer"}'
        values: '1x10'
      - series: 'kube_job_created{exported_namespace="default", job_name="fantasy-lineup-optimizer-29844540"}'
        values: '1790672400x10'
      - series: 'kube_job_failed{exported_namespace="default", job_name="fantasy-lineup-optimizer-29844540", condition="true"}'
        values: '1x10'
      - series: 'kube_job_owner{exported_namespace="default", job_name="fantasy-weekly-ingestor-29844480", owner_kind="CronJob", owner_name="fantasy-weekly-ingestor"}'
        values: '1x10'
      - series: 'kube_job_created{exported_namespace="default", job_name="fantasy-weekly-ingestor-29844480"}'
        values: '1790668800x10'
      - series: 'kube_job_failed{exported_namespace="default", job_name="fantasy-weekly-ingestor-29844480", condition="true"}'
        values: '1x10'
      - series: 'kube_job_owner{exported_namespace="default", job_name="unwatched-cronjob-29844550", owner_kind="CronJob", owner_name="unwatched-cronjob"}'
        values: '1x10'
      - series: 'kube_job_created{exported_namespace="default", job_name="unwatched-cronjob-29844550"}'
        values: '1790673000x10'
      - series: 'kube_job_failed{exported_namespace="default", job_name="unwatched-cronjob-29844550", condition="true"}'
        values: '1x10'
      - series: 'kube_cronjob_next_schedule_time{exported_namespace="default", cronjob="fantasy-lineup-optimizer"}'
        values: '1791282600x10'
    alert_rule_test:
      - eval_time: 5m
        alertname: fantasy-cronjob-job-failed
        exp_alerts:
          - exp_labels: {exported_namespace: default, owner_name: fantasy-lineup-optimizer, job_name: fantasy-lineup-optimizer-29844540}
          - exp_labels: {exported_namespace: default, owner_name: fantasy-weekly-ingestor, job_name: fantasy-weekly-ingestor-29844480}
      - eval_time: 5m
        alertname: fantasy-cronjob-missed-schedule
        exp_alerts: []

  # The 19:15 CDT slot crosses midnight UTC. A missing Job leaves next_schedule_time
  # overdue; the two-hour grace still applies to the actual timezone-aware timestamp.
  - name: missed Tuesday run alerts after 2h grace (CDT)
    interval: 1m
    start_timestamp: 1791936900 # 2026-10-14 00:15 UTC = Tuesday 19:15 CDT
    input_series:
      - series: 'kube_cronjob_next_schedule_time{exported_namespace="default", cronjob="fantasy-lineup-optimizer"}'
        values: '1791936900x180'
    alert_rule_test:
      - eval_time: 60m
        alertname: fantasy-cronjob-missed-schedule
        exp_alerts: []
      - eval_time: 125m
        alertname: fantasy-cronjob-missed-schedule
        exp_alerts:
          - exp_labels: {exported_namespace: default, cronjob: fantasy-lineup-optimizer}

  # After DST ends, 19:15 CST is 01:15 UTC the following day. At 02:20 UTC,
  # assuming the summer UTC offset would fire early; wait until after 03:15 UTC.
  - name: missed Tuesday run follows America/Chicago across DST (CST)
    interval: 1m
    start_timestamp: 1793745900 # 2026-11-03 22:45 UTC = 16:45 CST
    input_series:
      - series: 'kube_cronjob_next_schedule_time{exported_namespace="default", cronjob="fantasy-lineup-optimizer"}'
        values: '1793754900x300'
    alert_rule_test:
      - eval_time: 215m # 2026-11-04 02:20 UTC
        alertname: fantasy-cronjob-missed-schedule
        exp_alerts: []
      - eval_time: 275m # 2026-11-04 03:20 UTC
        alertname: fantasy-cronjob-missed-schedule
        exp_alerts:
          - exp_labels: {exported_namespace: default, cronjob: fantasy-lineup-optimizer}

  # fantasy-infra#101: the waiver trigger exits 1 on empty target-week pools
  # (fantasy-core-pipeline#181). Its latest Job (2026-10-06 06:00 CDT = 11:00 UTC) failed,
  # so it fires. The older failed 2026-09-29 04:30 Job is not the latest, so it doesn't
  # fire on its own.
  - name: latest waiver trigger Job failed alerts
    interval: 1m
    start_timestamp: 1791285000 # 2026-10-06 11:10 UTC
    input_series:
      - series: 'kube_job_owner{exported_namespace="default", job_name="fantasy-weekly-waiver-trigger-29844570", owner_kind="CronJob", owner_name="fantasy-weekly-waiver-trigger"}'
