# promtool unit tests for base/telemetry's alert rules; run via ./run.sh, which
# renders rules.yaml from the committed ConfigMaps (see render_rules.py).
# Series use real epochs. Historical failure fixtures retain their original creation times
# (Jobs from 2026-09-22/29, when the weekly jobs were still CronJobs); the rules match by
# CronJob name, not schedule. Missed-run DST fixtures use trade-inbox's 22:00
# America/Chicago slot.
# kube_job_created's value is the creation time; next_schedule_time is what
# kube-state-metrics reports (it applies spec.timeZone). As on the live cluster, a
# succeeded Job has no kube_job_failed{condition="true"} series at all.
rule_files: [rules.yaml]
evaluation_interval: 1m

tests:
  # Healthy week. The latest trade-candidates and reconcile Jobs succeeded and the next runs
  # are scheduled. The reconcile CronJob also has an older failed Job still in
  # failedJobsHistoryLimit, which must not fire.
  - name: success with an older failed Job in history does not alert
    interval: 1m
    start_timestamp: 1790673000 # 2026-09-29 09:10 UTC, after both runs
    input_series:
      - series: 'kube_job_owner{exported_namespace="default", job_name="fantasy-trade-candidates-29834460", owner_kind="CronJob", owner_name="fantasy-trade-candidates"}'
        values: '1x10'
      - series: 'kube_job_created{exported_namespace="default", job_name="fantasy-trade-candidates-29834460"}'
        values: '1790067600x10'
      - series: 'kube_job_owner{exported_namespace="default", job_name="fantasy-trade-candidates-29844540", owner_kind="CronJob", owner_name="fantasy-trade-candidates"}'
        values: '1x10'
      - series: 'kube_job_created{exported_namespace="default", job_name="fantasy-trade-candidates-29844540"}'
        values: '1790672400x10'
      - series: 'kube_job_owner{exported_namespace="default", job_name="fantasy-sync-actual-scores-reconcile-29814240", owner_kind="CronJob", owner_name="fantasy-sync-actual-scores-reconcile"}'
        values: '1x10'
      - series: 'kube_job_created{exported_namespace="default", job_name="fantasy-sync-actual-scores-reconcile-29814240"}'
        values: '1788854400x10'
      - series: 'kube_job_failed{exported_namespace="default", job_name="fantasy-sync-actual-scores-reconcile-29814240", condition="true"}'
        values: '1x10'
      - series: 'kube_job_owner{exported_namespace="default", job_name="fantasy-sync-actual-scores-reconcile-29844480", owner_kind="CronJob", owner_name="fantasy-sync-actual-scores-reconcile"}'
        values: '1x10'
      - series: 'kube_job_created{exported_namespace="default", job_name="fantasy-sync-actual-scores-reconcile-29844480"}'
        values: '1790668800x10'
      - series: 'kube_cronjob_next_schedule_time{exported_namespace="default", cronjob="fantasy-trade-candidates"}'
        values: '1791282600x10'
      - series: 'kube_cronjob_status_last_successful_time{exported_namespace="default", cronjob="fantasy-trade-candidates"}'
        values: '1790672409x10'
      - series: 'kube_cronjob_status_last_successful_time{exported_namespace="default", cronjob="fantasy-sync-actual-scores-reconcile"}'
        values: '1790668813x10'
    alert_rule_test:
      - eval_time: 5m
        alertname: fantasy-cronjob-job-failed
        exp_alerts: []
      - eval_time: 5m
        alertname: fantasy-cronjob-missed-schedule
        exp_alerts: []
    promql_expr_test:
      # The failed alert's "last successful run" context joins on owner_name.
      - expr: grafana_context:fantasy_cronjob_job_failed:D
        eval_time: 5m
        exp_samples:
          - labels: 'grafana_context:fantasy_cronjob_job_failed:D{exported_namespace="default", owner_name="fantasy-trade-candidates"}'
            value: 1790672409
          - labels: 'grafana_context:fantasy_cronjob_job_failed:D{exported_namespace="default", owner_name="fantasy-sync-actual-scores-reconcile"}'
            value: 1790668813

  # The latest trade-candidates and reconcile Jobs both failed. Each fires with its Job
  # name. A failed CronJob outside the watched set doesn't fire. The runs did happen, so the next
  # schedule advanced and "missed" stays quiet: failed and missed are separate states.
  - name: latest Job failed alerts per CronJob
    interval: 1m
    start_timestamp: 1790673000
    input_series:
      - series: 'kube_job_owner{exported_namespace="default", job_name="fantasy-trade-candidates-29834460", owner_kind="CronJob", owner_name="fantasy-trade-candidates"}'
        values: '1x10'
      - series: 'kube_job_created{exported_namespace="default", job_name="fantasy-trade-candidates-29834460"}'
        values: '1790067600x10'
      - series: 'kube_job_owner{exported_namespace="default", job_name="fantasy-trade-candidates-29844540", owner_kind="CronJob", owner_name="fantasy-trade-candidates"}'
        values: '1x10'
      - series: 'kube_job_created{exported_namespace="default", job_name="fantasy-trade-candidates-29844540"}'
        values: '1790672400x10'
      - series: 'kube_job_failed{exported_namespace="default", job_name="fantasy-trade-candidates-29844540", condition="true"}'
        values: '1x10'
      - series: 'kube_job_owner{exported_namespace="default", job_name="fantasy-sync-actual-scores-reconcile-29844480", owner_kind="CronJob", owner_name="fantasy-sync-actual-scores-reconcile"}'
        values: '1x10'
      - series: 'kube_job_created{exported_namespace="default", job_name="fantasy-sync-actual-scores-reconcile-29844480"}'
        values: '1790668800x10'
      - series: 'kube_job_failed{exported_namespace="default", job_name="fantasy-sync-actual-scores-reconcile-29844480", condition="true"}'
        values: '1x10'
      - series: 'kube_job_owner{exported_namespace="default", job_name="unwatched-cronjob-29844550", owner_kind="CronJob", owner_name="unwatched-cronjob"}'
        values: '1x10'
      - series: 'kube_job_created{exported_namespace="default", job_name="unwatched-cronjob-29844550"}'
        values: '1790673000x10'
      - series: 'kube_job_failed{exported_namespace="default", job_name="unwatched-cronjob-29844550", condition="true"}'
        values: '1x10'
      - series: 'kube_cronjob_next_schedule_time{exported_namespace="default", cronjob="fantasy-trade-candidates"}'
        values: '1791282600x10'
    alert_rule_test:
      - eval_time: 5m
        alertname: fantasy-cronjob-job-failed
        exp_alerts:
          - exp_labels: {exported_namespace: default, owner_name: fantasy-trade-candidates, job_name: fantasy-trade-candidates-29844540}
          - exp_labels: {exported_namespace: default, owner_name: fantasy-sync-actual-scores-reconcile, job_name: fantasy-sync-actual-scores-reconcile-29844480}
      - eval_time: 5m
        alertname: fantasy-cronjob-missed-schedule
        exp_alerts: []

  # trade-inbox's 22:00 CDT slot crosses midnight UTC. A missing Job leaves
  # next_schedule_time overdue; the two-hour grace still applies to the actual
  # timezone-aware timestamp.
  - name: missed late-evening run alerts after 2h grace (CDT)
    interval: 1m
    start_timestamp: 1791946800 # 2026-10-14 03:00 UTC = Tuesday 22:00 CDT
    input_series:
      - series: 'kube_cronjob_next_schedule_time{exported_namespace="default", cronjob="trade-inbox"}'
        values: '1791946800x180'
    alert_rule_test:
      - eval_time: 60m
        alertname: fantasy-cronjob-missed-schedule
        exp_alerts: []
      - eval_time: 125m
        alertname: fantasy-cronjob-missed-schedule
        exp_alerts:
          - exp_labels: {exported_namespace: default, cronjob: trade-inbox}

  # After DST ends, 22:00 CST is 04:00 UTC the following day. At 05:20 UTC,
  # assuming the summer UTC offset would fire early; wait until after 06:00 UTC.
  - name: missed late-evening run follows America/Chicago across DST (CST)
    interval: 1m
    start_timestamp: 1793745900 # 2026-11-03 22:45 UTC = 16:45 CST
    input_series:
      - series: 'kube_cronjob_next_schedule_time{exported_namespace="default", cronjob="trade-inbox"}'
        values: '1793764800x480'
    alert_rule_test:
      - eval_time: 395m # 2026-11-04 05:20 UTC
        alertname: fantasy-cronjob-missed-schedule
        exp_alerts: []
      - eval_time: 455m # 2026-11-04 06:20 UTC
        alertname: fantasy-cronjob-missed-schedule
        exp_alerts:
          - exp_labels: {exported_namespace: default, cronjob: trade-inbox}

