apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../base
- configmap-env.yaml
- externalsecrets.yaml
- argocd-image-updater-externalsecret.yaml
- argocd-repo-ssh-externalsecret.yaml
images:
- name: ghcr.io/cvillarr23/fantasy-web-ui
  digest: sha256:00f341be218ec5516091b9ce175257e8041e99d648dd654490c63e4cdcc1e4f2
- name: ghcr.io/cvillarr23/fantasy-core-pipeline
  digest: sha256:daba50a2682ff345759f3551f317b0255e3d2012acb69e0d858a78af1829b395
- name: ghcr.io/cvillarr23/fantasy-browser-worker
  digest: sha256:2475cb23a6a680e1970c4907051e76dd1da6c61df5b30f90efc0b1c803cffa5e
patches:
# Preserve string quoting when the replacement copies a boolean-looking flag.
- target:
    kind: Deployment
    name: fantasy-core-pipeline
  patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: fantasy-core-pipeline
    spec:
      template:
        metadata:
          annotations:
            fantasy-infra/auto-publish-ir-moves: ""
replacements:
# ConfigMap env changes do not refresh running containers. Mirror the flag into
# the gateway pod template so changing this one shared key also rolls the HTTP publisher.
- source:
    kind: ConfigMap
    name: fantasy-league-config
    fieldPath: data.AUTO_PUBLISH_IR_MOVES
  targets:
  - select:
      kind: Deployment
      name: fantasy-core-pipeline
    fieldPaths:
    - spec.template.metadata.annotations.fantasy-infra/auto-publish-ir-moves
# The launcher resolves the CORE_IMAGE and WORKER_IMAGE placeholders in its catalog profiles from
# its own env. They are plain env strings, so neither the `images:` transformer above nor Argo CD
# Image Updater's git write-back can see them: a release digest-pins every real `image:` field
# while env strings silently stay on whatever SHA was last hardcoded. That once stranded the
# API-spawned draft Jobs several commits behind the Deployment. Sourcing each value from an
# already-transformed `image:` field keeps them digest-pinned with no second place to bump.
- source:
    kind: Deployment
    name: fantasy-job-launcher
    fieldPath: spec.template.spec.containers.[name=launcher].image
  targets:
  - select:
      kind: Deployment
      name: fantasy-job-launcher
    fieldPaths:
    - spec.template.spec.containers.[name=launcher].env.[name=CORE_IMAGE].value
- source:
    kind: ScaledJob
    name: fantasy-browser-worker-scaler
    fieldPath: spec.jobTargetRef.template.spec.containers.[name=worker].image
  targets:
  - select:
      kind: Deployment
      name: fantasy-job-launcher
    fieldPaths:
    - spec.template.spec.containers.[name=launcher].env.[name=WORKER_IMAGE].value
