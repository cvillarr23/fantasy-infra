apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../base
- configmap-env.yaml
- externalsecrets.yaml
- argocd-image-updater-externalsecret.yaml
images:
- name: ghcr.io/cvillarr23/fantasy-web-ui
  digest: sha256:40177399577399d0152819b696ad069dba708faa31bfae77cb5076e4709d9069
- name: ghcr.io/cvillarr23/fantasy-core-pipeline
  digest: sha256:92996615397f7aaadd65702bf3c68a90c70f503003b51c5c10077068e7d59696
- name: ghcr.io/cvillarr23/fantasy-browser-worker
  digest: sha256:8993e51fc5629f12ea88727166e1581c6c5b984fe1df643d9b4daf2c0298a4f1
# DRAFT_SYNC_IMAGE and BROWSER_WORKER_IMAGE name the images core-pipeline uses when it spawns
# draft Jobs at runtime. They are plain env strings, so neither the `images:` transformer above
# nor Argo CD Image Updater's git write-back can see them: a release digest-pins every real
# `image:` field while these two silently stay on whatever SHA was last hardcoded.
#
# Not theoretical - this stranded the spawned draft Jobs several commits behind the Deployment,
# so merged fixes looked deployed while the Jobs kept running the old code.
#
# Sourcing each value from an already-transformed `image:` field keeps them digest-pinned and
# updated by the same mechanism, with no second place to remember to bump.
replacements:
- source:
    kind: Deployment
    name: fantasy-core-pipeline
    fieldPath: spec.template.spec.containers.[name=gateway].image
  targets:
  - select:
      kind: Deployment
      name: fantasy-core-pipeline
    fieldPaths:
    - spec.template.spec.containers.[name=gateway].env.[name=DRAFT_SYNC_IMAGE].value
- source:
    kind: ScaledJob
    name: fantasy-browser-worker-scaler
    fieldPath: spec.jobTargetRef.template.spec.containers.[name=worker].image
  targets:
  - select:
      kind: Deployment
      name: fantasy-core-pipeline
    fieldPaths:
    - spec.template.spec.containers.[name=gateway].env.[name=BROWSER_WORKER_IMAGE].value
