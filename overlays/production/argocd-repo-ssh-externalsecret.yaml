# Argo CD repository credential for this repo over SSH, built from the image updater's deploy
# key (OpenBao `fantasy/argocd-image-updater-git`, the same key as
# argocd-image-updater-externalsecret.yaml).
#
# The image updater writes digests back with whatever credential Argo CD holds for the
# Application's repoURL. Over HTTPS that is the account token, which main's ruleset rejects for
# direct pushes; deploy keys bypass the ruleset. Once this secret exists, homelab-deployment
# points the fantasy-infra Application at git@github.com:cvillarr23/fantasy-infra.git, so both
# sync and write-back use this key.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: repo-fantasy-infra-ssh
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: repo-fantasy-infra-ssh
    template:
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repository
      data:
        type: git
        url: git@github.com:cvillarr23/fantasy-infra.git
        sshPrivateKey: "{{ .sshPrivateKey }}"
  data:
    - secretKey: sshPrivateKey
      remoteRef:
        key: fantasy/argocd-image-updater-git
        property: ssh-private-key
