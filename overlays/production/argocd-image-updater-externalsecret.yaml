# Argo CD Image Updater git credentials: allows Image Updater to authenticate to GitHub
# when committing digest updates back to this repo. Uses deploy key-style credentials.
#
# Before first use, populate the secret in OpenBao:
#   bao kv put secret/fantasy/argocd-image-updater-git \
#     ssh-private-key=@/path/to/deploy/key \
#     ssh-public-key=@/path/to/deploy/key.pub
#
# Alternatively, for HTTPS authentication (less recommended):
#   bao kv put secret/fantasy/argocd-image-updater-git \
#     username=<github-username> \
#     token=<PAT with repo scope>
#
# Image Updater will mount this secret at /home/argocd/.ssh/id_rsa and use SSH authentication.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-image-updater-git-credentials
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: argocd-image-updater-git-credentials
  data:
    - secretKey: id_rsa
      remoteRef:
        key: fantasy/argocd-image-updater-git
        property: ssh-private-key
    - secretKey: id_rsa.pub
      remoteRef:
        key: fantasy/argocd-image-updater-git
        property: ssh-public-key

