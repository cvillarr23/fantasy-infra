        key: fantasy/espn
        property: swid
---
# The full Playwright storageState (cookies + localStorage) that remote_login.js writes after a
# real login (fantasy#129). Rendered ESPN pages (the trade builder) are unreliable with espn_s2/
# SWID alone; auth.js's createSessionFromStoredState reads this via ESPN_SESSION_STATE_FILE.
# Separate from espn-session-secrets so a missing/renamed key here can't break cookie auth, and
# mounted optional, so workers fall back to cookies without it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: espn-session-state
  namespace: default
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: espn-session-state
  data:
    - secretKey: state.json
      remoteRef:
        key: fantasy/espn-session-state
        property: state
---
# Shared secret guarding core-pipeline's /v1/trigger/* routes (checked by
# require_trigger_api_key), which cause real ESPN side effects and are called
# in-cluster, bypassing oauth2-proxy in front of web-ui.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: trigger-api-key
  namespace: default
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: trigger-api-key
  data:
    - secretKey: trigger-api-key
      remoteRef:
        key: fantasy/trigger-api-key
        property: trigger_api_key
---
