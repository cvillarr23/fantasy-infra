apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rabbitmq-credentials
  namespace: default
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: rabbitmq-credentials
    template:
      engineVersion: v2
      mergePolicy: Merge
      data:
        # Composed connection string so consumers (app env, KEDA trigger auth)
        # don't each need to reassemble it from the raw user/password fields.
        # Default vhost must be the percent-encoded "%2f", not a bare trailing "/" -
        # a bare "//" parses as vhost "" (empty string) in pika and most AMQP clients,
        # not "/", and RabbitMQ then rejects the connection with "vhost  not found".
        amqp-url: "amqp://{{ index . \"rabbitmq-user\" }}:{{ index . \"rabbitmq-password\" }}@fantasy-broker.default.svc.cluster.local:5672/%2f"
  data:
    - secretKey: rabbitmq-user
      remoteRef:
        key: fantasy/rabbitmq
        property: rabbitmq-user
    - secretKey: rabbitmq-password
      remoteRef:
        key: fantasy/rabbitmq
        property: rabbitmq-password
---
# oauth2-proxy's Google OAuth client credentials + session cookie-signing
# secret (CORE-29, base/oauth2-proxy/). The Google OAuth 2.0 Client can be
# the same one already created for OpenBao's browser OIDC login
# (homelab-deployment's scripts/openbao-oidc-setup.sh) - just add
# https://draft.roo-net.cc/oauth2/callback as an additional Authorized
# Redirect URI in Google Cloud Console - or a fresh client works too.
# cookie-secret must be a 16/24/32-byte value, base64 URL-safe encoded:
#   openssl rand -base64 32 | tr -- '+/' '-_'
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: oauth2-proxy-credentials
  namespace: default
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: oauth2-proxy-credentials
  data:
    - secretKey: client-id
      remoteRef:
        key: fantasy/oauth2-proxy
        property: client-id
    - secretKey: client-secret
      remoteRef:
        key: fantasy/oauth2-proxy
        property: client-secret
    - secretKey: cookie-secret
      remoteRef:
        key: fantasy/oauth2-proxy
        property: cookie-secret
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr-pull-secret
  namespace: default
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: ghcr-pull-secret
    template:
      type: kubernetes.io/dockerconfigjson
      engineVersion: v2
      data:
        # WORKER-07's images are private (same visibility as this private repo), pulled via this
        # secret rather than made public — referenced as imagePullSecrets by any pod pulling
        # ghcr.io/cvillarr23/fantasy-browser-worker.
        .dockerconfigjson: |
          {"auths":{"ghcr.io":{"username":"{{ .username }}","password":"{{ .token }}","auth":"{{ printf "%s:%s" .username .token | b64enc }}"}}}
  data:
    - secretKey: username
      remoteRef:
        key: fantasy/ghcr
        property: username
    - secretKey: token
      remoteRef:
        key: fantasy/ghcr
        property: token
---
# Argo CD Image Updater credentials: reads image tags from GHCR registries to check for
# newer digests. Uses the same fantasy/ghcr secret path as the pod imagePullSecret above
# (ghcr-pull-secret), but materializes a .dockerconfigjson file in the argocd namespace
# instead. Same credential, different namespace and format for Image Updater's consumption.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr-pull-secret
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: ghcr-pull-secret
    template:
      type: kubernetes.io/dockerconfigjson
      engineVersion: v2
      data:
        .dockerconfigjson: |
          {"auths":{"ghcr.io":{"username":"{{ .username }}","password":"{{ .token }}","auth":"{{ printf "%s:%s" .username .token | b64enc }}"}}}
  data:
    - secretKey: username
      remoteRef:
        key: fantasy/ghcr
        property: username
    - secretKey: token
      remoteRef:
        key: fantasy/ghcr
        property: token
