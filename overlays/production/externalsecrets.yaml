# Pulled from the shared OpenBao ClusterSecretStore in homelab-deployment
# (see homelab-deployment's apps/openbao/ and
# apps/external-secrets/cluster-secret-store.yaml) rather than committed in
# cleartext. Materializes regular Secrets with the same names every other
# manifest in this repo already references, so nothing else needs to change.
#
# Put the credentials in once by hand (not managed by this repo):
#   bao kv put secret/fantasy/postgres postgres-password=<value>
#   bao kv put secret/fantasy/postgres-readonly readonly-password=<value>
#   bao kv put secret/fantasy/espn espn_s2=<value> swid=<value>
#   bao kv put secret/fantasy/groq groq_api_key=<value>
#   bao kv put secret/fantasy/gemini gemini_api_key=<value>
#   bao kv put secret/fantasy/rabbitmq rabbitmq-user=<value> rabbitmq-password=<value>
#   bao kv put secret/fantasy/ghcr username=<github-username> token=<PAT with read:packages scope>
#   bao kv put secret/fantasy/oauth2-proxy client-id=<value> client-secret=<value> cookie-secret=<value>
#   bao kv put secret/fantasy/trigger-api-key trigger_api_key=<value>
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: database-credentials
  namespace: default
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: database-credentials
  data:
    - secretKey: postgres-password
      remoteRef:
        key: fantasy/postgres
        property: postgres-password
---
# Password for the read-only `grafana_reader` Postgres role (INFRA-06), provisioned by
# base/databases/postgres-readonly-role-job.yaml. homelab-deployment's Grafana datasource
# reads this same OpenBao path (secret/fantasy/postgres-readonly) directly, so there's a
# single source of truth for this credential across both repos.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: readonly-database-credentials
  namespace: default
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: readonly-database-credentials
  data:
    - secretKey: readonly-password
      remoteRef:
        key: fantasy/postgres-readonly
        property: readonly-password
---
