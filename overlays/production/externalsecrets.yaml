# Pulled from the shared OpenBao ClusterSecretStore in homelab-deployment
# (see homelab-deployment's apps/openbao/ and
# apps/external-secrets/cluster-secret-store.yaml) rather than committed in
# cleartext. Materializes regular Secrets with the same names every other
# manifest in this repo already references, so nothing else needs to change.
#
# Put the credentials in once by hand (not managed by this repo):
#   bao kv put secret/fantasy/postgres postgres-password=<value>
#   bao kv put secret/fantasy/espn espn_s2=<value> swid=<value>
#   bao kv put secret/fantasy/groq groq_api_key=<value>
#   bao kv put secret/fantasy/rabbitmq rabbitmq-user=<value> rabbitmq-password=<value>
#   bao kv put secret/fantasy/ghcr username=<github-username> token=<PAT with read:packages scope>
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: database-credentials
  namespace: default
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: database-credentials
  data:
    - secretKey: postgres-password
      remoteRef:
        key: fantasy/postgres
        property: postgres-password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: espn-session-secrets
  namespace: default
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: espn-session-secrets
  data:
    - secretKey: espn_s2
      remoteRef:
        key: fantasy/espn
        property: espn_s2
    - secretKey: swid
      remoteRef:
        key: fantasy/espn
        property: swid
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: groq-api-key
  namespace: default
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: groq-api-key
  data:
    - secretKey: groq_api_key
      remoteRef:
        key: fantasy/groq
        property: groq_api_key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rabbitmq-credentials
  namespace: default
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: rabbitmq-credentials
    template:
      engineVersion: v2
      mergePolicy: Merge
      data:
        # Composed connection string so consumers (app env, KEDA trigger auth)
        # don't each need to reassemble it from the raw user/password fields.
        amqp-url: "amqp://{{ index . \"rabbitmq-user\" }}:{{ index . \"rabbitmq-password\" }}@fantasy-broker.default.svc.cluster.local:5672//"
  data:
    - secretKey: rabbitmq-user
      remoteRef:
        key: fantasy/rabbitmq
        property: rabbitmq-user
    - secretKey: rabbitmq-password
      remoteRef:
        key: fantasy/rabbitmq
        property: rabbitmq-password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr-pull-secret
  namespace: default
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: ghcr-pull-secret
    template:
      type: kubernetes.io/dockerconfigjson
      engineVersion: v2
      data:
        # WORKER-07's images are private (same visibility as this private repo), pulled via this
        # secret rather than made public — referenced as imagePullSecrets by any pod pulling
        # ghcr.io/cvillarr23/fantasy-browser-worker.
        .dockerconfigjson: |
          {"auths":{"ghcr.io":{"username":"{{ .username }}","password":"{{ .token }}","auth":"{{ printf "%s:%s" .username .token | b64enc }}"}}}
  data:
    - secretKey: username
      remoteRef:
        key: fantasy/ghcr
        property: username
    - secretKey: token
      remoteRef:
        key: fantasy/ghcr
        property: token
