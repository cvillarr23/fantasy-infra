# The external TLS reverse proxy routes public UI traffic to this node port.
apiVersion: v1
kind: Service
metadata:
  name: oauth2-proxy
  labels:
    app: oauth2-proxy
spec:
  type: NodePort
  ports:
    - port: 4180
      targetPort: 4180
      nodePort: 30292
      protocol: TCP
      name: http
  selector:
    app: oauth2-proxy
