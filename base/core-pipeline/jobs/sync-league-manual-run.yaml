# One-off manual run of sync_league (fantasy-core-pipeline/src/ingestion/sync_league.py).
# Not wired into kustomization.yaml on purpose: nothing schedules sync_league anywhere in
# this cluster (fantasy-weekly-ingestor only runs metrics_extractor; draft-prep-refresher
# only runs sync_projections/vorp_matrix), so league_rosters never gets repopulated after a
# draft/trade without someone applying a Job like this by hand. See
# fantasy-core-pipeline issue for the actual automation gap this works around.
#
# Apply once with `kubectl apply -f`, then `kubectl delete job/sync-league-manual-20260916`
# when done - re-running it just means bumping the date suffix, since Job names must be
# unique and this isn't meant to be reapplied automatically.
apiVersion: batch/v1
kind: Job
metadata:
  name: sync-league-manual-20260916
  namespace: default
  labels:
    app: fantasy-core-pipeline
    component: sync-league-manual
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app: fantasy-core-pipeline
        component: sync-league-manual
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: sync-league
          image: ghcr.io/cvillarr23/fantasy-core-pipeline:e3536eea5cedb1f0c646db1b38e008aa7d630940
          imagePullPolicy: Always
          command: ["python", "-m", "src.ingestion.sync_league", "--season", "2026"]
          envFrom:
            - configMapRef:
                name: fantasy-league-config
          env:
            - name: DB_HOST
              value: "fantasy-db.default.svc.cluster.local"
            - name: DB_NAME
              value: "fantasy_football"
            - name: DB_USER
              value: "bot_admin"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: database-credentials
                  key: postgres-password
            - name: ESPN_S2
              valueFrom:
                secretKeyRef:
                  name: espn-session-secrets
                  key: espn_s2
            - name: ESPN_SWID
              valueFrom:
                secretKeyRef:
                  name: espn-session-secrets
                  key: swid
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
