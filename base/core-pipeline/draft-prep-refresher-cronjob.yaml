# Keeps weekly_stats.projected_points/vorp_score current for the ongoing season.
# sync_projections/vorp_matrix require --season/--week with no CLI default, so this reuses
# lineup_solver's resolve_default_week() (already proven by weekly-waiver-cronjob.yaml).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: fantasy-draft-prep-refresher
  namespace: default
spec:
  schedule: "0 5 * * *" # 5:00 AM Central, daily (timeZone below makes this expression local, not UTC), well clear of the other two ingestion CronJobs' windows
  timeZone: "America/Chicago"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      # Counts Pending time too: a pod that can't schedule (e.g. node CPU requests full) fails
      # the Job instead of sitting Pending forever, which under concurrencyPolicy: Forbid
      # silently skips every later run. Four sequential 600s week budgets leave
      # headroom within this deadline.
      activeDeadlineSeconds: 3600
      backoffLimit: 0
      template:
        metadata:
          labels:
            app: fantasy-core-pipeline
            component: draft-prep-refresher
        spec:
          restartPolicy: Never
          imagePullSecrets:
            - name: ghcr-pull-secret
          # Each week finishes projections, K/D-ST and VORP before the next starts.
          # Disable automatic whole-run retries so a future-week failure never replays
          # the already committed target week; the next daily run refreshes all weeks.
          containers:
            - name: draft-prep-refresher
              image: ghcr.io/cvillarr23/fantasy-core-pipeline:e3536eea5cedb1f0c646db1b38e008aa7d630940
              imagePullPolicy: Always
              command: ["python", "-u", "-c"]
              args:
                - |
                  import logging
                  import os
                  import subprocess
                  import sys
                  import time

                  logging.basicConfig(level=logging.INFO)
                  logger = logging.getLogger("DraftPrepRefresher")
                  WEEK_BUDGET_SECONDS = 600
                  STAGES = (
                      "src.ingestion.sync_projections",
                      "src.ingestion.sync_kicker_dst",
                      "src.optimization.vorp_matrix",
                  )


                  def main():
                      try:
                          from src.optimization.lineup_solver import resolve_default_week

                          season = int(os.environ["CURRENT_YEAR"])
                          first_week = int(resolve_default_week())
                          if first_week < 1:
                              raise ValueError("Target week must be at least 1")
                      except Exception:
                          logger.exception("Unable to resolve refresh season/week")
                          return 1
                      if first_week > 18:
                          logger.info("Offseason: season=%s week=%s; no regular-season weeks to refresh", season, first_week)
                          return 0

                      last_week = min(first_week + 3, 18)
                      completed, failed = [], []
                      logger.info("Refreshing season=%s weeks=%s..%s", season, first_week, last_week)
                      for week in range(first_week, last_week + 1):
                          week_started = time.monotonic()
                          for stage in STAGES:
                              stage_started = time.monotonic()
                              remaining = WEEK_BUDGET_SECONDS - (stage_started - week_started)
                              logger.info("Starting season=%s week=%s stage=%s budget_remaining=%.1fs", season, week, stage, remaining)
                              try:
                                  if remaining <= 0:
                                      raise subprocess.TimeoutExpired(stage, WEEK_BUDGET_SECONDS)
                                  subprocess.run(
                                      [sys.executable, "-u", "-m", stage, "--season", str(season), "--week", str(week)],
                                      check=True,
                                      timeout=remaining,
                                  )
                              except (subprocess.CalledProcessError, subprocess.TimeoutExpired, OSError) as exc:
                                  logger.error("Failed season=%s week=%s stage=%s elapsed=%.1fs: %s", season, week, stage, time.monotonic() - stage_started, exc)
                                  failed.append(week)
                                  break
                              logger.info("Completed season=%s week=%s stage=%s elapsed=%.1fs", season, week, stage, time.monotonic() - stage_started)
                          else:
                              completed.append(week)
                              logger.info("Week complete season=%s week=%s elapsed=%.1fs", season, week, time.monotonic() - week_started)

                          # The target week must finish before any horizon work starts. Later failures
                          # skip dependent stages but allow other weeks to refresh independently.
                          if week == first_week and failed:
                              break

                      logger.info("Refresh summary season=%s target_week=%s completed_weeks=%s failed_weeks=%s", season, first_week, completed, failed)
                      return 1 if failed else 0


                  sys.exit(main())
              envFrom:
                - configMapRef:
                    name: fantasy-league-config
              env:
                - name: DB_HOST
                  value: "fantasy-db.default.svc.cluster.local"
                - name: DB_NAME
                  value: "fantasy_football"
                - name: DB_USER
                  value: "bot_admin"
                - name: DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: database-credentials
                      key: postgres-password
                - name: ESPN_S2
                  valueFrom:
                    secretKeyRef:
                      name: espn-session-secrets
                      key: espn_s2
                - name: ESPN_SWID
                  valueFrom:
                    secretKeyRef:
                      name: espn-session-secrets
                      key: swid
                - name: OTEL_EXPORTER_OTLP_ENDPOINT
                  value: "http://tempo.default.svc.cluster.local:4318"
                - name: OTEL_EXPORTER_OTLP_PROTOCOL
                  value: "http/protobuf"
                - name: OTEL_SERVICE_NAME
                  value: "optimization-vorp-matrix"
              resources:
                requests:
                  memory: "256Mi"
                  cpu: "100m"
                limits:
                  memory: "512Mi"
                  cpu: "500m"
