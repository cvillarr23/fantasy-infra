# Temporary, draft-day-specific: keeps weekly_stats.projected_points/vorp_score current for
# the Sept 8, 2026 draft, since neither sync_projections nor vorp_matrix has any other
# scheduled automation (fantasy-weekly-ingestor only runs metrics_extractor, which is a no-op
# pre-season - no games have happened yet to extract advanced metrics from). Sleeper's own
# preseason projections and injury designations shift daily as roster news breaks, so a single
# manual pipeline run (done once, 2026-08-20) goes stale well before draft day.
#
# fantasy-core-pipeline#45 tracks the actual bug this schedule works around: the OTHER weekly
# CronJob crashes outright pre-season on its own default --year/--week resolution. This
# CronJob avoids that entirely by always passing explicit --season/--week.
#
# Scope note: hardcodes season=2026/week=1 deliberately - matches the same draft-day
# convention DRAFT_SYNC_WEEK uses in src/api/draft.py (a draft has no real "current week").
# This CronJob should be suspended (set spec.suspend: true) once the 2026-09-08 draft is
# over - after that, real season-long weekly_stats refresh needs actual per-week
# season/week values, which this manifest does not compute.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: fantasy-draft-prep-refresher
  namespace: default
spec:
  schedule: "0 10 * * *" # 5:00/4:00 AM Central (DST-dependent), daily, well clear of the other two ingestion CronJobs' windows
  timeZone: "America/Chicago"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: fantasy-core-pipeline
            component: draft-prep-refresher
        spec:
          restartPolicy: OnFailure
          imagePullSecrets:
            - name: ghcr-pull-secret
          # initContainer (sync_projections) must fully succeed before the main container
          # (vorp_matrix) starts - vorp_matrix computes vorp_score FROM projected_points, so
          # running them the other way round or in parallel would compute VORP against
          # yesterday's projections.
          initContainers:
            - name: sync-projections
              image: ghcr.io/cvillarr23/fantasy-core-pipeline:latest
              imagePullPolicy: Always
              command: ["python", "-m", "src.ingestion.sync_projections", "--season", "2026", "--week", "1"]
              env:
                - name: DB_HOST
                  value: "fantasy-db.default.svc.cluster.local"
                - name: DB_NAME
                  value: "fantasy_football"
                - name: DB_USER
                  value: "bot_admin"
                - name: DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: database-credentials
                      key: postgres-password
              resources:
                requests:
                  memory: "256Mi"
                  cpu: "100m"
                limits:
                  memory: "512Mi"
                  cpu: "500m"
          containers:
            - name: vorp-matrix
              image: ghcr.io/cvillarr23/fantasy-core-pipeline:latest
              imagePullPolicy: Always
              command: ["python", "-m", "src.optimization.vorp_matrix", "--season", "2026", "--week", "1"]
              env:
                - name: DB_HOST
                  value: "fantasy-db.default.svc.cluster.local"
                - name: DB_NAME
                  value: "fantasy_football"
                - name: DB_USER
                  value: "bot_admin"
                - name: DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: database-credentials
                      key: postgres-password
                - name: OTEL_EXPORTER_OTLP_ENDPOINT
                  value: "http://tempo.default.svc.cluster.local:4317"
                - name: OTEL_EXPORTER_OTLP_PROTOCOL
                  value: "grpc"
                - name: OTEL_SERVICE_NAME
                  value: "optimization-vorp-matrix"
              resources:
                requests:
                  memory: "256Mi"
                  cpu: "100m"
                limits:
                  memory: "512Mi"
                  cpu: "500m"
