# Keeps weekly_stats.projected_points/vorp_score current for the ongoing season.
# sync_projections/vorp_matrix require --season/--week with no CLI default, so this reuses
# lineup_solver's resolve_default_week() (already proven by weekly-waiver-cronjob.yaml).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: fantasy-draft-prep-refresher
  namespace: default
spec:
  schedule: "0 5 * * *" # 5:00 AM Central, daily (timeZone below makes this expression local, not UTC), well clear of the other two ingestion CronJobs' windows
  timeZone: "America/Chicago"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      # Counts Pending time too: a pod that can't schedule (e.g. node CPU requests full) fails
      # the Job instead of sitting Pending forever, which under concurrencyPolicy: Forbid
      # silently skips every later run. 3600s is far above its normal runtime.
      activeDeadlineSeconds: 3600
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: fantasy-core-pipeline
            component: draft-prep-refresher
        spec:
          restartPolicy: OnFailure
          imagePullSecrets:
            - name: ghcr-pull-secret
          # initContainers run in order and must each fully succeed before the main
          # container (vorp_matrix) starts - vorp_matrix computes vorp_score FROM
          # projected_points, so running them the other way round or in parallel would
          # compute VORP against yesterday's projections. sync_projections (Sleeper) covers
          # QB/RB/WR/TE; sync_kicker_dst (ESPN) covers every K and D/ST, rostered or not
          # (fantasy-core-pipeline#183). An ESPN failure (e.g. expired session cookies)
          # fails the Job and skips vorp_matrix for the day; the optimizer then uses the
          # previous run's target-week VORP or its prior-week fallback.
          initContainers:
            - name: sync-projections
              image: ghcr.io/cvillarr23/fantasy-core-pipeline:e3536eea5cedb1f0c646db1b38e008aa7d630940
              imagePullPolicy: Always
              command: ["/bin/sh", "-c"]
              args:
                - |
                  WEEK=$(python -c "from src.optimization.lineup_solver import resolve_default_week; print(resolve_default_week())") && \
                  python -m src.ingestion.sync_projections --season "$CURRENT_YEAR" --week "$WEEK"
              envFrom:
                - configMapRef:
                    name: fantasy-league-config
              env:
                - name: DB_HOST
                  value: "fantasy-db.default.svc.cluster.local"
                - name: DB_NAME
                  value: "fantasy_football"
                - name: DB_USER
                  value: "bot_admin"
                - name: DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: database-credentials
                      key: postgres-password
              resources:
                requests:
                  memory: "256Mi"
                  cpu: "100m"
                limits:
                  memory: "512Mi"
                  cpu: "500m"
            - name: sync-kicker-dst
              image: ghcr.io/cvillarr23/fantasy-core-pipeline:e3536eea5cedb1f0c646db1b38e008aa7d630940
              imagePullPolicy: Always
              command: ["/bin/sh", "-c"]
              args:
                - |
                  WEEK=$(python -c "from src.optimization.lineup_solver import resolve_default_week; print(resolve_default_week())") && \
                  python -m src.ingestion.sync_kicker_dst --season "$CURRENT_YEAR" --week "$WEEK"
              envFrom:
                - configMapRef:
                    name: fantasy-league-config
              env:
                - name: DB_HOST
                  value: "fantasy-db.default.svc.cluster.local"
                - name: DB_NAME
                  value: "fantasy_football"
                - name: DB_USER
                  value: "bot_admin"
                - name: DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: database-credentials
                      key: postgres-password
                - name: ESPN_S2
                  valueFrom:
                    secretKeyRef:
                      name: espn-session-secrets
                      key: espn_s2
                - name: ESPN_SWID
                  valueFrom:
                    secretKeyRef:
                      name: espn-session-secrets
                      key: swid
              resources:
                requests:
                  memory: "256Mi"
                  cpu: "100m"
                limits:
                  memory: "512Mi"
                  cpu: "500m"
          containers:
            - name: vorp-matrix
              image: ghcr.io/cvillarr23/fantasy-core-pipeline:e3536eea5cedb1f0c646db1b38e008aa7d630940
              imagePullPolicy: Always
              command: ["/bin/sh", "-c"]
              args:
                - |
                  WEEK=$(python -c "from src.optimization.lineup_solver import resolve_default_week; print(resolve_default_week())") && \
                  python -m src.optimization.vorp_matrix --season "$CURRENT_YEAR" --week "$WEEK"
              envFrom:
                - configMapRef:
                    name: fantasy-league-config
              env:
                - name: DB_HOST
                  value: "fantasy-db.default.svc.cluster.local"
                - name: DB_NAME
                  value: "fantasy_football"
                - name: DB_USER
                  value: "bot_admin"
                - name: DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: database-credentials
                      key: postgres-password
                - name: OTEL_EXPORTER_OTLP_ENDPOINT
                  value: "http://tempo.default.svc.cluster.local:4318"
                - name: OTEL_EXPORTER_OTLP_PROTOCOL
                  value: "http/protobuf"
                - name: OTEL_SERVICE_NAME
                  value: "optimization-vorp-matrix"
              resources:
                requests:
                  memory: "256Mi"
                  cpu: "100m"
                limits:
                  memory: "512Mi"
                  cpu: "500m"
