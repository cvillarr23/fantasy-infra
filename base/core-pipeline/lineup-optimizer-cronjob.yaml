# fantasy-browser-worker issue #80: nothing previously triggered the PuLP lineup solver
# (src/optimization/lineup_solver.py, CORE-06) on a recurring basis — lineup_bot.js's consumer
# side (WORKER-03) already works, but production had no automatic entry point to actually
# produce a LineupTriggerPayload. Runs one hour after fantasy-weekly-ingestor (weekly-cronjob.yaml,
# Tuesday 4am Central) so this week's metrics are already ingested before the solver runs.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: fantasy-lineup-optimizer
  namespace: default
spec:
  schedule: "0 4 * * 2" # 4:00 AM Central, every Tuesday (America/Chicago local time below)
  timeZone: "America/Chicago"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: fantasy-core-pipeline
            component: lineup-optimizer
        spec:
          restartPolicy: OnFailure
          imagePullSecrets:
            - name: ghcr-pull-secret
          containers:
            - name: lineup-optimizer
              image: ghcr.io/cvillarr23/fantasy-core-pipeline:e3536eea5cedb1f0c646db1b38e008aa7d630940
              imagePullPolicy: Always
              command: ["python", "-m", "src.optimization.lineup_solver"]
              envFrom:
                - configMapRef:
                    name: fantasy-league-config
              env:
                - name: DB_HOST
                  value: "fantasy-db.default.svc.cluster.local"
                - name: DB_NAME
                  value: "fantasy_football"
                - name: DB_USER
                  value: "bot_admin"
                - name: DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: database-credentials
                      key: postgres-password
                # Real in-cluster service DNS -- lineup_solver.py's own CORE_API_BASE_URL default
                # is stale (wrong namespace), so this must be set explicitly rather than relying
                # on the code default.
                - name: CORE_API_BASE_URL
                  value: "http://fantasy-core-pipeline.default.svc.cluster.local:8000"
                # Guards /v1/trigger/*, called in-cluster and bypassing oauth2-proxy.
                - name: TRIGGER_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: trigger-api-key
                      key: trigger-api-key
                # OTLP export target for homelab-deployment's shared Tempo instance
                # (homelab-deployment#5/#6) -- endpoint + service name only, actual
                # span emission is CORE-12.
                - name: OTEL_EXPORTER_OTLP_ENDPOINT
                  value: "http://tempo.default.svc.cluster.local:4318"
                - name: OTEL_EXPORTER_OTLP_PROTOCOL
                  value: "http/protobuf"
                - name: OTEL_SERVICE_NAME
                  value: "optimization-lineup-solver"
              resources:
                requests:
                  memory: "256Mi"
                  cpu: "100m"
                limits:
                  memory: "512Mi"
                  cpu: "500m"
