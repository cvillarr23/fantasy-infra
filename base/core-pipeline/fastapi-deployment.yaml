apiVersion: apps/v1
kind: Deployment
metadata:
  name: fantasy-core-pipeline
  labels:
    app: fantasy-core-pipeline
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fantasy-core-pipeline
  template:
    metadata:
      labels:
        app: fantasy-core-pipeline
        # Distinguishes the gateway from the core-pipeline CronJob pods, which share
        # app=fantasy-core-pipeline - the Service selects on this (see fastapi-service.yaml).
        component: gateway
    spec:
      serviceAccountName: fantasy-core-pipeline
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: gateway
          image: ghcr.io/cvillarr23/fantasy-core-pipeline:e3536eea5cedb1f0c646db1b38e008aa7d630940
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: fantasy-league-config
          env:
            # Database Topology Mapping
            - name: DB_HOST
              value: "fantasy-db.default.svc.cluster.local"
            - name: DB_NAME
              value: "fantasy_football"
            - name: DB_USER
              value: "bot_admin"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: database-credentials
                  key: postgres-password
            - name: AMQP_URL
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: amqp-url
            # Guards /v1/trigger/*, called in-cluster and bypassing oauth2-proxy.
            - name: TRIGGER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: trigger-api-key
                  key: trigger-api-key
            - name: REDIS_HOST
              value: "fantasy-cache.default.svc.cluster.local"
            - name: REDIS_PORT
              value: "6379"
            - name: ESPN_S2
              valueFrom:
                secretKeyRef:
                  name: espn-session-secrets
                  key: espn_s2
            - name: ESPN_SWID
              valueFrom:
                secretKeyRef:
                  name: espn-session-secrets
                  key: swid
            # Set directly - llm_client.py's OpenBao fallback shells out to `bao`, which isn't
            # on this image and has no pod route to OpenBao anyway (no Vault agent sidecar).
            # Same fix as browser-worker's rumor-digest-bot-cronjob.yaml.
            - name: GROQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: groq-api-key
                  key: groq_api_key
          # draft_matrix.py POSTs its chosen pick to /v1/trigger/draft-pick on this URL.
            # Set explicitly because the module default (fantasy-api.core.svc.cluster.local)
            # names a Service/namespace that does not exist in this cluster, which would make
            # every auto-draft publish fail once the listener Job is otherwise healthy.
            # core-pipeline propagates this value into the draft-sync Job it spawns.
            - name: CORE_API_BASE_URL
              value: "http://fantasy-core-pipeline.default.svc.cluster.local:8000"
            # fantasy-browser-worker's draft_sync.js image, used by POST /v1/draft/practice/sync-job
            # (CORE-18, cvillarr23/fantasy-web-ui#9) to launch the practice-room sync Job.
            #
            # PLACEHOLDER ONLY. The effective value is injected by the `replacements:` block in
            # overlays/production/kustomization.yaml, sourced from the browser-worker ScaledJob's
            # already-digest-pinned image. Editing this line by hand has no effect on a rendered
            # overlay - and hand-editing is exactly what let this drift behind the Deployment
            # while looking correct in git.
            - name: BROWSER_WORKER_IMAGE
              value: "ghcr.io/cvillarr23/fantasy-browser-worker:placeholder-set-by-kustomize-replacement"
            # fantasy-core-pipeline's draft_matrix.py image, used by POST /v1/draft/start for both live
            # and practice drafts (CORE-18) to launch the recommendation listener Job. The listener
            # runs this very repo's code, so it must track the gateway container's own image.
            #
            # PLACEHOLDER ONLY - see the note above; sourced from this Deployment's gateway image.
            - name: DRAFT_SYNC_IMAGE
              value: "ghcr.io/cvillarr23/fantasy-core-pipeline:placeholder-set-by-kustomize-replacement"
            # ConfigMap/Secret names that core-pipeline passes through when it spawns draft-sync jobs.
            # These carry ESPN session + league config only; the spawned Job's database/cache
            # settings are set explicitly by core-pipeline from this Deployment's own env, since
            # envFrom cannot rename database-credentials' postgres-password key to DB_PASSWORD.
            - name: DRAFT_SYNC_ENV_CONFIGMAP
              value: "fantasy-league-config"
            - name: DRAFT_SYNC_ENV_SECRET
              value: "espn-session-secrets"

            # OTLP export target for homelab-deployment's shared Tempo instance
            # (homelab-deployment#5/#6) -- endpoint + service name only, actual
            # span emission is CORE-12.
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://tempo.default.svc.cluster.local:4318"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "http/protobuf"
            - name: OTEL_SERVICE_NAME
              value: "fastapi-gateway"

            - name: ESPN_LEAGUE_ID
              valueFrom:
                secretKeyRef:
                  name: espn-session-secrets
                  key: ESPN_LEAGUE_ID
            - name: ESPN_TEAM_ID
              valueFrom:
                secretKeyRef:
                  name: espn-session-secrets
                  key: ESPN_TEAM_ID
          livenessProbe:
            httpGet:
              path: /v1/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /v1/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10

          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "1000m"
