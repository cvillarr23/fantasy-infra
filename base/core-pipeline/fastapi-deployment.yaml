apiVersion: apps/v1
kind: Deployment
metadata:
  name: fantasy-core-pipeline
  labels:
    app: fantasy-core-pipeline
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fantasy-core-pipeline
  template:
    metadata:
      labels:
        app: fantasy-core-pipeline
    spec:
      serviceAccountName: fantasy-core-pipeline
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: gateway
          image: ghcr.io/cvillarr23/fantasy-core-pipeline:073aad9a8b4db94f8fdf7da23bcfc8d29e9d06e6
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: fantasy-league-config
          env:
            # Database Topology Mapping
            - name: DB_HOST
              value: "fantasy-db.default.svc.cluster.local"
            - name: DB_NAME
              value: "fantasy_football"
            - name: DB_USER
              value: "bot_admin"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: database-credentials
                  key: postgres-password
            - name: AMQP_URL
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: amqp-url
            - name: REDIS_HOST
              value: "fantasy-cache.default.svc.cluster.local"
            - name: REDIS_PORT
              value: "6379"
            # fantasy-browser-worker's draft_sync.js image, used by POST /v1/draft/practice/sync-job
            # (CORE-18, cvillarr23/fantasy-web-ui#9) to launch the practice-room sync Job - same
            # image ref already hardcoded in base/browser-worker/keda-scaledjob.yaml and
            # espn-session-healthcheck-cronjob.yaml.
            - name: BROWSER_WORKER_IMAGE
              value: "ghcr.io/cvillarr23/fantasy-browser-worker:929083b992e3d2f95e74ee421ebcd75306f6ee31"
            # fantasy-core-pipeline's draft_matrix.py image, used by POST /v1/draft/start for both live
            # and practice drafts (CORE-18) to launch the recommendation listener Job - same image ref
            # as the current gateway container itself.
            - name: DRAFT_SYNC_IMAGE
              value: "ghcr.io/cvillarr23/fantasy-core-pipeline:073aad9a8b4db94f8fdf7da23bcfc8d29e9d06e6"

            # OTLP export target for homelab-deployment's shared Tempo instance
            # (homelab-deployment#5/#6) -- endpoint + service name only, actual
            # span emission is CORE-12.
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://tempo.default.svc.cluster.local:4317"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "grpc"
            - name: OTEL_SERVICE_NAME
              value: "fastapi-gateway"

          livenessProbe:
            httpGet:
              path: /v1/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /v1/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10

          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "1000m"
