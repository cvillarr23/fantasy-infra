apiVersion: batch/v1
kind: CronJob
metadata:
  name: fantasy-weekly-ingestor
  namespace: default
spec:
  schedule: "0 16 * * 2" # 16:00 Central Tuesday gives nflverse time to publish Monday-night data.
  timeZone: "America/Chicago"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      # Counts Pending time too: a pod that can't schedule (e.g. node CPU requests full) fails
      # the Job instead of sitting Pending forever, which under concurrencyPolicy: Forbid
      # silently skips every later run. 3600s is far above its normal runtime.
      activeDeadlineSeconds: 3600
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: fantasy-core-pipeline
            component: weekly-ingestor
        spec:
          restartPolicy: OnFailure
          imagePullSecrets:
            - name: ghcr-pull-secret
          # initContainer (sync_league) must fully succeed before the main container
          # (metrics_extractor) starts - this is the only scheduled place sync_league
          # runs, so league_rosters otherwise never refreshes after a draft/trade/waiver.
          initContainers:
            - name: sync-league
              image: ghcr.io/cvillarr23/fantasy-core-pipeline:e3536eea5cedb1f0c646db1b38e008aa7d630940
              imagePullPolicy: Always
              command: ["python", "-m", "src.ingestion.sync_league", "--season", "2026"]
              envFrom:
                - configMapRef:
                    name: fantasy-league-config
              env:
                - name: DB_HOST
                  value: "fantasy-db.default.svc.cluster.local"
                - name: DB_NAME
                  value: "fantasy_football"
                - name: DB_USER
                  value: "bot_admin"
                - name: DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: database-credentials
                      key: postgres-password
                - name: ESPN_S2
                  valueFrom:
                    secretKeyRef:
                      name: espn-session-secrets
                      key: espn_s2
                - name: ESPN_SWID
                  valueFrom:
                    secretKeyRef:
                      name: espn-session-secrets
                      key: swid
              resources:
                requests:
                  memory: "256Mi"
                  cpu: "100m"
                limits:
                  memory: "512Mi"
                  cpu: "500m"
          containers:
            - name: ingestor
              image: ghcr.io/cvillarr23/fantasy-core-pipeline:e3536eea5cedb1f0c646db1b38e008aa7d630940
              imagePullPolicy: Always
              command: ["python", "-m", "src.ingestion.metrics_extractor"]
              env:
                - name: DB_HOST
                  value: "fantasy-db.default.svc.cluster.local"
                - name: DB_NAME
                  value: "fantasy_football"
                - name: DB_USER
                  value: "bot_admin"
                - name: DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: database-credentials
                      key: postgres-password
                # OTLP export target for homelab-deployment's shared Tempo instance
                # (homelab-deployment#5/#6) -- endpoint + service name only, actual
                # span emission is CORE-12.
                - name: OTEL_EXPORTER_OTLP_ENDPOINT
                  value: "http://tempo.default.svc.cluster.local:4318"
                - name: OTEL_EXPORTER_OTLP_PROTOCOL
                  value: "http/protobuf"
                - name: OTEL_SERVICE_NAME
                  value: "ingestion-metrics-extractor"
              resources:
                requests:
                  memory: "256Mi"
                  cpu: "100m"
                limits:
                  memory: "512Mi"
                  cpu: "500m"
