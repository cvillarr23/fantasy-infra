# Waiver decisions require the refreshed target-week VORP for exact-week
# bench/free-agent joins. Run after the Tuesday refresher and lineup optimizer
# so these decisions use the newly ingested metrics and current rosters.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: fantasy-weekly-waiver-trigger
  namespace: default
spec:
  schedule: "30 20 * * 2" # 20:30 Central Tuesday, after the optimizer's one-hour deadline.
  timeZone: "America/Chicago"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      # Counts Pending time too: a pod that can't schedule (e.g. node CPU requests full) fails
      # the Job instead of sitting Pending forever, which under concurrencyPolicy: Forbid
      # silently skips every later run. 3600s is far above its normal runtime.
      activeDeadlineSeconds: 3600
      # fantasy-infra#115 (same as #110 for the lineup optimizer): each retry is a fresh pod
      # (restartPolicy: Never below). Under OnFailure, container restarts count toward
      # backoffLimit, so backoffLimit: 1 failed the Job - and killed the pod - on its first
      # restart, even when that retry would have succeeded. Never also keeps failed pods, and
      # their logs, until history cleanup. Re-running the whole evaluator is only safe because
      # /v1/trigger/waiver dedupes each claim on a key scoped to team + season/week + add/drop
      # (fantasy-core-pipeline#193/#194/#191), so claims an earlier attempt queued come back
      # "duplicate". No JOB_NAME env, unlike the lineup CronJob: the waiver key deliberately
      # spans every Job that week. An insufficient-input exit (#178) just fails the same way
      # 3 times, a minute or so later.
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: fantasy-core-pipeline
            component: weekly-waiver-trigger
        spec:
          restartPolicy: Never
          imagePullSecrets:
            - name: ghcr-pull-secret
          containers:
            - name: waiver-trigger
              image: ghcr.io/cvillarr23/fantasy-core-pipeline:e3536eea5cedb1f0c646db1b38e008aa7d630940
              imagePullPolicy: Always
              command: ["/bin/sh", "-c"]
              # waiver_evaluator.py's --week has no env-var fallback (unlike lineup_solver.py's
              # --team-id/--season), so the week comes from core's
              # src.nfl_schedule.resolve_upcoming_week(): the upcoming CURRENT_YEAR week from the
              # nflverse schedule. It retries the download, then raises instead of guessing a week,
              # so the Job fails rather than claiming waivers for the wrong week. An empty week
              # means the regular season is over, a clean no-op.
              args:
                - |
                  WEEK=$(python -c "import os; from src.nfl_schedule import resolve_upcoming_week; week = resolve_upcoming_week(int(os.environ['CURRENT_YEAR'])); print('' if week is None else week)") || exit 1
                  if [ -z "$WEEK" ]; then
                    echo "Offseason: the $CURRENT_YEAR regular season is over; no waiver claims to evaluate."
                    exit 0
                  fi
                  exec python -m src.optimization.waiver_evaluator --team-id "$ESPN_TEAM_ID" --season "$CURRENT_YEAR" --week "$WEEK"
              envFrom:
                - configMapRef:
                    name: fantasy-league-config
              env:
                - name: DB_HOST
                  value: "fantasy-db.default.svc.cluster.local"
                - name: DB_NAME
                  value: "fantasy_football"
                - name: DB_USER
                  value: "bot_admin"
                - name: DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: database-credentials
                      key: postgres-password
                # Real in-cluster service DNS -- waiver_evaluator.py's own CORE_API_BASE_URL
                # default is stale (wrong namespace), so this must be set explicitly rather than
                # relying on the code default.
                - name: CORE_API_BASE_URL
                  value: "http://fantasy-core-pipeline.default.svc.cluster.local:8000"
                # Guards /v1/trigger/*, called in-cluster and bypassing oauth2-proxy.
                - name: TRIGGER_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: trigger-api-key
                      key: trigger-api-key
                # OTLP export target for homelab-deployment's shared Tempo instance
                # (homelab-deployment#5/#6) -- endpoint + service name only, actual
                # span emission is CORE-12.
                - name: OTEL_EXPORTER_OTLP_ENDPOINT
                  value: "http://tempo.default.svc.cluster.local:4318"
                - name: OTEL_EXPORTER_OTLP_PROTOCOL
                  value: "http/protobuf"
                - name: OTEL_SERVICE_NAME
                  value: "optimization-waiver-evaluator"
                - name: ESPN_LEAGUE_ID
                  valueFrom:
                    secretKeyRef:
                      name: espn-session-secrets
                      key: ESPN_LEAGUE_ID
                - name: ESPN_TEAM_ID
                  valueFrom:
                    secretKeyRef:
                      name: espn-session-secrets
                      key: ESPN_TEAM_ID
              resources:
                requests:
                  memory: "256Mi"
                  cpu: "100m"
                limits:
                  memory: "512Mi"
                  cpu: "500m"
