# Narrowly-scoped ServiceAccount + Role + RoleBinding so the fantasy-core-pipeline FastAPI
# gateway pod can create/monitor the draft-sync Job via the Kubernetes API instead of requiring
# manual `kubectl` access from the user (who will be traveling internationally on Sept 8, 2026).
# Default namespace only, no broader cluster permissions -- not a general-purpose k8s-admin
# credential. Same scoping convention as WORKER-12's ollama/rbac.yaml.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fantasy-core-pipeline
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: draft-sync-orchestrator
  namespace: default
rules:
  # RBAC can't scope "create" by resourceNames -- the object doesn't exist yet at auth time --
  # so job creation is unscoped and monitoring is scoped separately below. This means the
  # gateway SA can technically create *any* Job (any name/spec) in `default`, not only
  # `draft-sync` -- a real gap, not an oversight. Closing it properly needs either a
  # ValidatingAdmissionPolicy restricting Job specs for this SA (unavailable/unsafe here: this
  # repo's floor is Kubernetes 1.27+ per README, VAP didn't GA/enable-by-default until 1.30,
  # and there's no admission-controller infra in this cluster to fall back on) or reworking
  # fantasy-core-pipeline's CORE-10 to patch a pre-provisioned suspended Job instead of
  # creating one (an app-side change out of scope for this infra-only PR). Accepted as a
  # bounded risk for now: this is a single-tenant homelab cluster, and this same gateway pod
  # already holds `bot_admin` DB and AMQP credentials with strictly greater blast radius than
  # "create another Job in this namespace." Revisit with a VAP once the cluster is confirmed
  # on 1.30+.
  # get/list/delete have the same resourceNames problem as create above -- draft-sync Job
  # names are dynamic (draft-sync-{league_id}-{timestamp}, or draft-sync-practice-... for
  # CORE-18's practice-mode Jobs), so they can't be scoped to a fixed name either. The
  # previous get-only rule below used resourceNames: ["draft-sync"], which never matched any
  # Job this SA actually creates -- effectively a no-op that also left list/delete ungranted,
  # so fantasy-core-pipeline's own Job-status polling (_job_state, used by /status, /stream,
  # and /start's already-Active check) and CORE-18's new /stop teardown endpoint were both
  # silently unauthorized. Unscoped for the same accepted-risk reasoning as create above.
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "delete"]
  # Pod names under the Job are controller-generated, so they can't be scoped by resourceNames
  # either; get/list/watch is left namespace-wide per the issue's stated scope.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fantasy-core-pipeline-draft-sync-orchestrator
  namespace: default
subjects:
  - kind: ServiceAccount
    name: fantasy-core-pipeline
    namespace: default
roleRef:
  kind: Role
  name: draft-sync-orchestrator
  apiGroup: rbac.authorization.k8s.io
