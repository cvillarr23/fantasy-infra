# ServiceAccount + read-only Role for the fantasy-core-pipeline FastAPI gateway. The draft
# endpoints start and cancel draft runs through the job launcher (fantasy-core-pipeline#350),
# which creates and deletes their Jobs, so the gateway only reads: Job phase for
# /v1/draft/status and /stream, Job absence after a cancel (before /stop clears Redis), and pods
# and pod logs for /v1/draft/logs. Default namespace only.
#
# The role keeps its draft-sync-orchestrator name so the RoleBinding and any live references
# keep working; it no longer orchestrates anything.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fantasy-core-pipeline
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: draft-sync-orchestrator
  namespace: default
rules:
  # Launcher Job names are dynamic (<job>-<run id>-a<attempt>), so these can't be scoped by
  # resourceNames; the gateway selects them by the fantasy.run-id label.
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list"]
  # Pod names under a Job are controller-generated, so they can't be scoped by resourceNames
  # either.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fantasy-core-pipeline-draft-sync-orchestrator
  namespace: default
subjects:
  - kind: ServiceAccount
    name: fantasy-core-pipeline
    namespace: default
roleRef:
  kind: Role
  name: draft-sync-orchestrator
  apiGroup: rbac.authorization.k8s.io
