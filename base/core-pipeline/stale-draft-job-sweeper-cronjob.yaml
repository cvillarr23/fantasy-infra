apiVersion: batch/v1
kind: CronJob
metadata:
  name: fantasy-stale-draft-job-sweeper
  namespace: default
spec:
  schedule: "*/15 * * * *" # every 15 minutes (America/Chicago local time below)
  timeZone: "America/Chicago"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      # Finished Jobs (and their pods' logs) are removed after 7 days, so failures from
      # weeks ago stop cluttering `kubectl get jobs`; the run audit log keeps the history.
      ttlSecondsAfterFinished: 604800
      # Counts Pending time too: a pod that can't schedule (e.g. node CPU requests full) fails
      # the Job instead of sitting Pending forever, which under concurrencyPolicy: Forbid
      # silently skips every later run. 840s is just under the schedule interval.
      activeDeadlineSeconds: 840
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: fantasy-core-pipeline
            component: stale-draft-job-sweeper
        spec:
          # The sweeper lists and deletes draft Jobs; without this it ran as the
          # `default` SA and every run died on a 403 listing jobs.batch. The
          # draft-sync-orchestrator Role (jobs get/list/delete) is bound to this SA.
          serviceAccountName: fantasy-core-pipeline
          restartPolicy: OnFailure
          imagePullSecrets:
            - name: ghcr-pull-secret
          containers:
            - name: sweeper
              image: ghcr.io/cvillarr23/fantasy-core-pipeline:e3536eea5cedb1f0c646db1b38e008aa7d630940
              imagePullPolicy: Always
              command: ["python", "-m", "src.ops.sweep_stale_draft_jobs"]
              env:
                # Run audit log: which CronJob and Job this run belongs to (scheduled vs manual).
                - name: RUN_CRONJOB
                  value: "fantasy-stale-draft-job-sweeper"
                - name: RUN_K8S_JOB
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.labels['batch.kubernetes.io/job-name']
                - name: DB_HOST
                  value: "fantasy-db.default.svc.cluster.local"
                - name: DB_NAME
                  value: "fantasy_football"
                - name: DB_USER
                  value: "bot_admin"
                - name: DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: database-credentials
                      key: postgres-password
                - name: AMQP_URL
                  valueFrom:
                    secretKeyRef:
                      name: rabbitmq-credentials
                      key: amqp-url
                - name: REDIS_HOST
                  value: "fantasy-cache.default.svc.cluster.local"
                - name: REDIS_PORT
                  value: "6379"
                # Real in-cluster service DNS -- sweep_stale_draft_jobs.py's own
                # CORE_API_BASE_URL default (fantasy-api.core...) doesn't resolve, so the
                # teardown call failed; same override as the lineup/waiver CronJobs.
                - name: CORE_API_BASE_URL
                  value: "http://fantasy-core-pipeline.default.svc.cluster.local:8000"
                # OTLP export target for homelab-deployment's shared Tempo instance
                # (homelab-deployment#5/#6) -- endpoint + service name only, actual
                # span emission is CORE-12.
                - name: OTEL_EXPORTER_OTLP_ENDPOINT
                  value: "http://tempo.default.svc.cluster.local:4318"
                - name: OTEL_EXPORTER_OTLP_PROTOCOL
                  value: "http/protobuf"
                - name: OTEL_SERVICE_NAME
                  value: "ops-sweep-stale-draft-jobs"
              resources:
                requests:
                  memory: "256Mi"
                  cpu: "100m"
                limits:
                  memory: "512Mi"
                  cpu: "500m"
