# The rumor digest bot writes advisory-only signals daily, but nothing previously acted on them
# before the weekly waiver/lineup cadence caught up. Runs the evaluator/publisher daily instead.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: fantasy-rumor-action-trigger
  namespace: default
spec:
  schedule: "0 12 * * *" # 12:00 PM Central, every day (America/Chicago local time below)
  timeZone: "America/Chicago"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: fantasy-core-pipeline
            component: rumor-action-trigger
        spec:
          restartPolicy: OnFailure
          imagePullSecrets:
            - name: ghcr-pull-secret
          containers:
            - name: rumor-action-trigger
              image: ghcr.io/cvillarr23/fantasy-core-pipeline:e3536eea5cedb1f0c646db1b38e008aa7d630940
              imagePullPolicy: Always
              command: ["python", "-m", "src.services.rumor_action_service"]
              args: ["--team-id", "$(ESPN_TEAM_ID)", "--season", "$(CURRENT_YEAR)"]
              envFrom:
                - configMapRef:
                    name: fantasy-league-config
              env:
                - name: DB_HOST
                  value: "fantasy-db.default.svc.cluster.local"
                - name: DB_NAME
                  value: "fantasy_football"
                - name: DB_USER
                  value: "bot_admin"
                - name: DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: database-credentials
                      key: postgres-password
                - name: REDIS_HOST
                  value: "fantasy-cache.default.svc.cluster.local"
                - name: REDIS_PORT
                  value: "6379"
                - name: CORE_API_BASE_URL
                  value: "http://fantasy-core-pipeline.default.svc.cluster.local:8000"
                # OTLP export target for homelab-deployment's shared Tempo instance
                # (homelab-deployment#5/#6) -- endpoint + service name only, actual
                # span emission is CORE-12.
                - name: OTEL_EXPORTER_OTLP_ENDPOINT
                  value: "http://tempo.default.svc.cluster.local:4318"
                - name: OTEL_EXPORTER_OTLP_PROTOCOL
                  value: "http/protobuf"
                - name: OTEL_SERVICE_NAME
                  value: "services-rumor-action-trigger"
              resources:
                requests:
                  memory: "256Mi"
                  cpu: "100m"
                limits:
                  memory: "512Mi"
                  cpu: "500m"
