# Rumor actions call the lineup and waiver evaluators, which consume target-week VORP.
# Run after the daily refresher and Tuesday waiver window; the 11:00 digest
# is already available when this evaluator processes its advisory signals.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: fantasy-rumor-action-trigger
  namespace: default
spec:
  schedule: "45 21 * * *" # 21:45 Central daily, after fresh VORP and Tuesday's waiver window.
  timeZone: "America/Chicago"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      # Counts Pending time too: a pod that can't schedule (e.g. node CPU requests full) fails
      # the Job instead of sitting Pending forever, which under concurrencyPolicy: Forbid
      # silently skips every later run. 3600s is far above its normal runtime.
      activeDeadlineSeconds: 3600
      # fantasy-infra#122: each retry gets a fresh pod and preserves failed-pod logs. The
      # core service checkpoints rumor actions and resumes only unfinished work
      # (fantasy-core-pipeline#198), so re-running this Job cannot discard its watermark.
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: fantasy-core-pipeline
            component: rumor-action-trigger
        spec:
          restartPolicy: Never
          imagePullSecrets:
            - name: ghcr-pull-secret
          containers:
            - name: rumor-action-trigger
              image: ghcr.io/cvillarr23/fantasy-core-pipeline:e3536eea5cedb1f0c646db1b38e008aa7d630940
              imagePullPolicy: Always
              command: ["python", "-m", "src.services.rumor_action_service"]
              args: ["--team-id", "$(ESPN_TEAM_ID)", "--season", "$(CURRENT_YEAR)"]
              envFrom:
                - configMapRef:
                    name: fantasy-league-config
              env:
                # Gives rumor_action_service and lineup_solver one stable identity across
                # pod retries, while each scheduled Job receives its own idempotency scope.
                - name: JOB_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.labels['batch.kubernetes.io/job-name']
                - name: DB_HOST
                  value: "fantasy-db.default.svc.cluster.local"
                - name: DB_NAME
                  value: "fantasy_football"
                - name: DB_USER
                  value: "bot_admin"
                - name: DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: database-credentials
                      key: postgres-password
                - name: REDIS_HOST
                  value: "fantasy-cache.default.svc.cluster.local"
                - name: REDIS_PORT
                  value: "6379"
                - name: CORE_API_BASE_URL
                  value: "http://fantasy-core-pipeline.default.svc.cluster.local:8000"
                # OTLP export target for homelab-deployment's shared Tempo instance
                # (homelab-deployment#5/#6) -- endpoint + service name only, actual
                # span emission is CORE-12.
                - name: OTEL_EXPORTER_OTLP_ENDPOINT
                  value: "http://tempo.default.svc.cluster.local:4318"
                - name: OTEL_EXPORTER_OTLP_PROTOCOL
                  value: "http/protobuf"
                - name: OTEL_SERVICE_NAME
                  value: "services-rumor-action-trigger"
              resources:
                requests:
                  memory: "256Mi"
                  cpu: "100m"
                limits:
                  memory: "512Mi"
                  cpu: "500m"
