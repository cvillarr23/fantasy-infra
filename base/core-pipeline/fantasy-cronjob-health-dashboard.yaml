# CronJob run state for the fantasy-infra#75 alerts (base/telemetry/): tells a missed
# schedule, a failed Job and a successful run apart. The log panel separates a successful
# zero-swap optimizer run ("already optimal") from one that published swaps.
# Same sidecar discovery as the other dashboards here (grafana_dashboard: "1").
apiVersion: v1
kind: ConfigMap
metadata:
  name: fantasy-cronjob-health-grafana-dashboard
  namespace: default
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: Fantasy
data:
  fantasy-cronjob-health.json: |
    {
      "annotations": {
        "list": []
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "id": null,
      "links": [
        {
          "title": "Runbook",
          "type": "link",
          "targetBlank": true,
          "url": "https://github.com/cvillarr23/fantasy-infra/blob/main/docs/cronjob-alerts.md"
        }
      ],
      "liveNow": false,
      "panels": [
        {
          "type": "table",
          "title": "CronJob run state",
          "id": 1,
          "gridPos": {
            "h": 12,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "description": "One row per watched CronJob. Missed schedule uses the same per-job grace as the alerts: 20m rapid status, 30m sweeper, 60m rumor sync, 2h daily/weekly. Failed Job considers only the newest Job; older failures are ignored. Optimizer success includes zero swaps. Runbook: docs/cronjob-alerts.md.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "((max by (cronjob) (time() - kube_cronjob_next_schedule_time{exported_namespace=\"default\",cronjob=~\"fantasy-(draft-prep-refresher|lineup-optimizer|rumor-action-trigger|weekly-ingestor|weekly-waiver-trigger)|espn-session-healthcheck|rumor-digest-bot\",cronjob=~\"$cronjob\"} > bool 7200)) or (max by (cronjob) (time() - kube_cronjob_next_schedule_time{exported_namespace=\"default\",cronjob=~\"fantasy-rapid-status-syncer\",cronjob=~\"$cronjob\"} > bool 1200)) or (max by (cronjob) (time() - kube_cronjob_next_schedule_time{exported_namespace=\"default\",cronjob=~\"fantasy-stale-draft-job-sweeper\",cronjob=~\"$cronjob\"} > bool 1800)) or (max by (cronjob) (time() - kube_cronjob_next_schedule_time{exported_namespace=\"default\",cronjob=~\"fantasy-rumor-syncer\",cronjob=~\"$cronjob\"} > bool 3600))) * 2 + on (cronjob) max by (cronjob) (label_replace((((kube_job_created * on (exported_namespace, job_name) group_left (owner_name) max by (exported_namespace, job_name, owner_name) (kube_job_owner{owner_kind=\"CronJob\", owner_name=~\"$cronjob\"})) == on (exported_namespace, owner_name) group_left () max by (exported_namespace, owner_name) ((kube_job_created * on (exported_namespace, job_name) group_left (owner_name) max by (exported_namespace, job_name, owner_name) (kube_job_owner{owner_kind=\"CronJob\", owner_name=~\"$cronjob\"})))) * 0 + on (exported_namespace, job_name) group_left () kube_job_failed{condition=\"true\"}) or (((kube_job_created * on (exported_namespace, job_name) group_left (owner_name) max by (exported_namespace, job_name, owner_name) (kube_job_owner{owner_kind=\"CronJob\", owner_name=~\"$cronjob\"})) == on (exported_namespace, owner_name) group_left () max by (exported_namespace, owner_name) ((kube_job_created * on (exported_namespace, job_name) group_left (owner_name) max by (exported_namespace, job_name, owner_name) (kube_job_owner{owner_kind=\"CronJob\", owner_name=~\"$cronjob\"})))) * 0), \"cronjob\", \"$1\", \"owner_name\", \"(.*)\"))",
              "instant": true,
              "format": "table"
            },
            {
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "max by (cronjob, job_name) (label_replace(((kube_job_created * on (exported_namespace, job_name) group_left (owner_name) max by (exported_namespace, job_name, owner_name) (kube_job_owner{owner_kind=\"CronJob\", owner_name=~\"$cronjob\"})) == on (exported_namespace, owner_name) group_left () max by (exported_namespace, owner_name) ((kube_job_created * on (exported_namespace, job_name) group_left (owner_name) max by (exported_namespace, job_name, owner_name) (kube_job_owner{owner_kind=\"CronJob\", owner_name=~\"$cronjob\"})))), \"cronjob\", \"$1\", \"owner_name\", \"(.*)\")) * 1000",
              "instant": true,
              "format": "table"
            },
            {
              "refId": "C",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "max by (cronjob) (kube_cronjob_status_last_schedule_time{cronjob=~\"$cronjob\"}) * 1000",
              "instant": true,
              "format": "table"
            },
            {
              "refId": "D",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "max by (cronjob) (kube_cronjob_status_last_successful_time{cronjob=~\"$cronjob\"}) * 1000",
              "instant": true,
              "format": "table"
            },
            {
              "refId": "E",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "max by (cronjob) (kube_cronjob_next_schedule_time{cronjob=~\"$cronjob\"}) * 1000",
              "instant": true,
              "format": "table"
            },
            {
              "refId": "F",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "max by (cronjob) (kube_cronjob_status_active{cronjob=~\"$cronjob\"})",
              "instant": true,
              "format": "table"
            },
            {
              "refId": "G",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "(max by (cronjob) (kube_cronjob_next_schedule_time{exported_namespace=\"default\",cronjob=~\"fantasy-(draft-prep-refresher|lineup-optimizer|rumor-action-trigger|weekly-ingestor|weekly-waiver-trigger)|espn-session-healthcheck|rumor-digest-bot\",cronjob=~\"$cronjob\"}) * 0 + 7200) or (max by (cronjob) (kube_cronjob_next_schedule_time{exported_namespace=\"default\",cronjob=~\"fantasy-rapid-status-syncer\",cronjob=~\"$cronjob\"}) * 0 + 1200) or (max by (cronjob) (kube_cronjob_next_schedule_time{exported_namespace=\"default\",cronjob=~\"fantasy-stale-draft-job-sweeper\",cronjob=~\"$cronjob\"}) * 0 + 1800) or (max by (cronjob) (kube_cronjob_next_schedule_time{exported_namespace=\"default\",cronjob=~\"fantasy-rumor-syncer\",cronjob=~\"$cronjob\"}) * 0 + 3600)",
              "instant": true,
              "format": "table"
            }
          ],
          "transformations": [
            {
              "id": "merge",
              "options": {}
            },
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true
                },
                "indexByName": {
                  "cronjob": 0,
                  "Value #A": 1,
                  "job_name": 2,
                  "Value #B": 3,
                  "Value #C": 4,
                  "Value #D": 5,
                  "Value #E": 6,
                  "Value #F": 7,
                  "Value #G": 8
                },
                "renameByName": {
                  "cronjob": "CronJob",
                  "Value #A": "State",
                  "job_name": "Latest Job",
                  "Value #B": "Latest Job created",
                  "Value #C": "Last scheduled",
                  "Value #D": "Last successful",
                  "Value #E": "Next expected",
                  "Value #F": "Active Jobs",
                  "Value #G": "Missed-run grace"
                }
              }
            }
          ],
          "fieldConfig": {
            "defaults": {},
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "State"
                },
                "properties": [
                  {
                    "id": "mappings",
                    "value": [
                      {
                        "type": "value",
                        "options": {
                          "0": {
                            "text": "Succeeded",
                            "color": "green",
                            "index": 0
                          },
                          "1": {
                            "text": "Failed Job",
                            "color": "red",
                            "index": 1
                          },
                          "2": {
                            "text": "Missed schedule",
                            "color": "orange",
                            "index": 2
                          },
                          "3": {
                            "text": "Missed schedule (last Job failed)",
                            "color": "orange",
                            "index": 3
                          }
                        }
                      }
                    ]
                  },
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-background"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Latest Job created"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "dateTimeAsIso"
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Last scheduled"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "dateTimeAsIso"
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Last successful"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "dateTimeAsIso"
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Next expected"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "dateTimeAsIso"
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Missed-run grace"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "s"
                  }
                ]
              }
            ]
          },
          "options": {
            "showHeader": true
          }
        },
        {
          "type": "logs",
          "title": "Lineup optimizer outcome (no-op vs swaps vs missing input)",
          "id": 2,
          "gridPos": {
            "h": 10,
            "w": 24,
            "x": 0,
            "y": 12
          },
          "description": "A successful optimizer Job either published swaps (\"Published N lineup swap(s)\") or found the lineup already optimal (\"Lineup already optimal\"). Neither is an alert. \"No active roster metrics\" is missing input, which fails the Job once fantasy-core-pipeline#178 ships.",
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "expr": "{namespace=\"default\", container=\"lineup-optimizer\"} |~ \"Lineup already optimal|Published [0-9]+ lineup swap|Evaluating Team|cannot evaluate|Traceback|ERROR\""
            }
          ],
          "options": {
            "showTime": true,
            "wrapLogMessage": true,
            "sortOrder": "Descending"
          }
        }
      ],
      "refresh": "5m",
      "schemaVersion": 39,
      "tags": [
        "fantasy",
        "cronjob"
      ],
      "templating": {
        "list": [
          {
            "name": "cronjob",
            "label": "CronJob",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "query": {
              "query": "label_values(kube_cronjob_info{exported_namespace=\"default\"}, cronjob)",
              "refId": "cronjob"
            },
            "definition": "label_values(kube_cronjob_info{exported_namespace=\"default\"}, cronjob)",
            "multi": true,
            "includeAll": true,
            "refresh": 1,
            "current": {
              "text": "All",
              "value": "$__all"
            },
            "allValue": "fantasy-(draft-prep-refresher|lineup-optimizer|rapid-status-syncer|rumor-action-trigger|rumor-syncer|stale-draft-job-sweeper|weekly-ingestor|weekly-waiver-trigger)|espn-session-healthcheck|rumor-digest-bot"
          }
        ]
      },
      "time": {
        "from": "now-14d",
        "to": "now"
      },
      "timezone": "America/Chicago",
      "title": "Fantasy CronJob Health",
      "uid": "fantasy-cronjob-health",
      "version": 2
    }
