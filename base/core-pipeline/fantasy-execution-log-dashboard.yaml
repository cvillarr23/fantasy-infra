# Execution-log overview for all bots, giving the rumor-digest/rumor-action
# failure alerts a dashboard to jump into instead of being orphaned.
apiVersion: v1
kind: ConfigMap
metadata:
  name: fantasy-execution-log-grafana-dashboard
  namespace: default
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: Fantasy
data:
  fantasy-execution-log.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "id": null,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "type": "stat",
          "title": "Overall Success Rate (24h)",
          "gridPos": { "h": 5, "w": 6, "x": 0, "y": 0 },
          "id": 1,
          "datasource": { "type": "postgres", "uid": "FantasyFootballDB" },
          "fieldConfig": { "defaults": { "unit": "percent", "min": 0, "max": 100 }, "overrides": [] },
          "targets": [
            {
              "refId": "A",
              "format": "table",
              "rawSql": "SELECT (COUNT(*) FILTER (WHERE status='success'))::float / NULLIF(COUNT(*),0) * 100 AS success_pct FROM execution_log WHERE executed_at > now() - interval '24 hours';"
            }
          ]
        },
        {
          "type": "barchart",
          "title": "Success/Failure Rate by Bot (24h)",
          "description": "Execution counts by bot_name and status, last 24 hours.",
          "gridPos": { "h": 8, "w": 18, "x": 6, "y": 0 },
          "id": 2,
          "datasource": { "type": "postgres", "uid": "FantasyFootballDB" },
          "targets": [
            {
              "refId": "A",
              "format": "table",
              "rawSql": "SELECT bot_name, status, COUNT(*) AS n FROM execution_log WHERE executed_at > now() - interval '24 hours' AND bot_name IS NOT NULL GROUP BY bot_name, status ORDER BY bot_name;"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Execution Volume Over Time",
          "description": "Hourly execution counts per bot, last 7 days.",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "id": 3,
          "datasource": { "type": "postgres", "uid": "FantasyFootballDB" },
          "targets": [
            {
              "refId": "A",
              "format": "time_series",
              "rawSql": "SELECT date_trunc('hour', executed_at) AS time, bot_name, COUNT(*) AS executions FROM execution_log WHERE executed_at > now() - interval '7 days' AND bot_name IS NOT NULL GROUP BY 1, bot_name ORDER BY 1;"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "p50/p95 Duration by Bot (24h)",
          "description": "Hourly p50/p95 duration_ms per bot, last 24 hours.",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "id": 4,
          "datasource": { "type": "postgres", "uid": "FantasyFootballDB" },
          "targets": [
            {
              "refId": "A",
              "format": "time_series",
              "rawSql": "SELECT date_trunc('hour', executed_at) AS time, bot_name || ' p50' AS metric, percentile_cont(0.5) WITHIN GROUP (ORDER BY duration_ms) AS value FROM execution_log WHERE executed_at > now() - interval '24 hours' AND duration_ms IS NOT NULL AND bot_name IS NOT NULL GROUP BY 1, bot_name ORDER BY 1;"
            },
            {
              "refId": "B",
              "format": "time_series",
              "rawSql": "SELECT date_trunc('hour', executed_at) AS time, bot_name || ' p95' AS metric, percentile_cont(0.95) WITHIN GROUP (ORDER BY duration_ms) AS value FROM execution_log WHERE executed_at > now() - interval '24 hours' AND duration_ms IS NOT NULL AND bot_name IS NOT NULL GROUP BY 1, bot_name ORDER BY 1;"
            }
          ]
        },
        {
          "type": "table",
          "title": "Recent Failures (Raw)",
          "description": "The 50 most recent failed executions across all bots.",
          "gridPos": { "h": 10, "w": 24, "x": 0, "y": 16 },
          "id": 5,
          "datasource": { "type": "postgres", "uid": "FantasyFootballDB" },
          "targets": [
            {
              "refId": "A",
              "format": "table",
              "rawSql": "SELECT executed_at, bot_name, transaction_type, error_message, trace_id FROM execution_log WHERE status IN ('failure', 'partial_failure') ORDER BY executed_at DESC LIMIT 50;"
            }
          ]
        },
        {
          "type": "table",
          "title": "Rumor Action Outcomes",
          "description": "One row per CLI/HTTP invocation. No new signals, no beneficial move and already queued are healthy. Accepted actions are queued, not confirmed in ESPN. Failures remain alertable for 26h even after a later success.",
          "gridPos": {
            "h": 10,
            "w": 24,
            "x": 0,
            "y": 26
          },
          "id": 6,
          "datasource": {
            "type": "postgres",
            "uid": "FantasyFootballDB"
          },
          "targets": [
            {
              "refId": "A",
              "format": "table",
              "rawSql": "SELECT executed_at, status, outcome_details->>'source' AS source, outcome_details->>'job_name' AS job_name, outcome_details->>'run_id' AS run_id, outcome_details->>'team_id' AS team_id, season, outcome_details->>'week' AS week, outcome_details->>'reason' AS reason, outcome_details->>'signals_fetched' AS signals_fetched, outcome_details->>'signals_qualifying' AS signals_qualifying, outcome_details->>'actions_proposed' AS actions_proposed, outcome_details->>'actions_accepted' AS actions_accepted, outcome_details->>'actions_already_queued' AS already_queued, outcome_details->>'actions_missing_identity' AS missing_identity, outcome_details->>'actions_failed' AS actions_failed, outcome_details->>'actions_unaccounted' AS actions_unaccounted, outcome_details->>'signals_unaccounted' AS signals_unaccounted, outcome_details->>'signal_reasons' AS signal_reasons, outcome_details->>'watermark_start' AS watermark_start, outcome_details->>'watermark_end' AS watermark_end, error_message FROM execution_log WHERE transaction_type = 'rumor_action_trigger' AND bot_name = 'rumor_action_service' AND $__timeFilter(executed_at) ORDER BY executed_at DESC, id DESC LIMIT 100;"
            }
          ]
        }
      ],
      "schemaVersion": 39,
      "tags": ["fantasy", "execution-log"],
      "templating": {
        "list": [
          {
            "name": "bot_name",
            "type": "query",
            "datasource": { "type": "postgres", "uid": "FantasyFootballDB" },
            "query": "SELECT DISTINCT bot_name FROM execution_log WHERE bot_name IS NOT NULL ORDER BY 1;",
            "refresh": 2,
            "includeAll": true,
            "multi": true
          }
        ]
      },
      "time": { "from": "now-24h", "to": "now" },
      "timepicker": {},
      "timezone": "",
      "title": "Fantasy Execution Log Overview",
      "uid": "fantasy-execution-log",
      "version": 1,
      "weekStart": ""
    }
