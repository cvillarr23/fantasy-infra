# One-shot provisioning for the read-only `grafana_reader` Postgres role (INFRA-06),
# consumed by homelab-deployment's Grafana FantasyFootballDB datasource. Kept as a Job
# rather than a persistent pod to stay resource-neutral -- it runs to completion and exits.
# Re-running (e.g. after a re-sync) is safe: the DO block below is idempotent.
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-readonly-role-sql
data:
  init-readonly-role.sql: |
    DO $$
    BEGIN
        CREATE ROLE grafana_reader LOGIN PASSWORD :'readonly_password';
    EXCEPTION WHEN duplicate_object THEN
        ALTER ROLE grafana_reader LOGIN PASSWORD :'readonly_password';
    END $$;

    GRANT CONNECT ON DATABASE fantasy_football TO grafana_reader;
    GRANT USAGE ON SCHEMA public TO grafana_reader;
    -- ALL TABLES (not a named list) so this Job doesn't hard-fail if it races ahead of
    -- core-pipeline's migrations on a fresh cluster -- granting against zero tables is a
    -- no-op, not an error. ALTER DEFAULT PRIVILEGES covers tables created afterward. Scoped
    -- to this single-purpose database, so the breadth stays equivalent to the named list
    -- (players, weekly_stats, league_rosters, league_settings, execution_log) in practice.
    GRANT SELECT ON ALL TABLES IN SCHEMA public TO grafana_reader;
    ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT ON TABLES TO grafana_reader;
---
apiVersion: batch/v1
kind: Job
metadata:
  name: postgres-readonly-role-init
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: role-init
          image: postgres:15-alpine
          command: ["sh", "-c"]
          args:
            - >
              psql -v ON_ERROR_STOP=1 -v readonly_password="$READONLY_PASSWORD"
              -f /sql/init-readonly-role.sql
          env:
            - name: PGHOST
              value: "fantasy-db.default.svc.cluster.local"
            - name: PGDATABASE
              value: "fantasy_football"
            - name: PGUSER
              value: "bot_admin"
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: database-credentials
                  key: postgres-password
            - name: READONLY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: readonly-database-credentials
                  key: readonly-password
          volumeMounts:
            - name: role-sql
              mountPath: /sql
      volumes:
        - name: role-sql
          configMap:
            name: postgres-readonly-role-sql
