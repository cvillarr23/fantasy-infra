apiVersion: v1
kind: Service
metadata:
  name: fantasy-broker
  labels:
    app: fantasy-broker
spec:
  ports:
    - port: 5672
      name: amqp
    - port: 15672
      name: management
  selector:
    app: fantasy-broker
---
# Pre-declares the queues KEDA's rabbitmq ScaledJob triggers depend on
# (base/browser-worker/keda-scaledjob.yaml). The KEDA rabbitmq scaler errors out
# (rather than reporting zero messages) when a queue doesn't exist yet, and with the
# worker running as a scale-to-zero job there's no permanent consumer around to declare
# them itself — so the broker has to own its own topology from boot.
apiVersion: v1
kind: ConfigMap
metadata:
  name: fantasy-broker-definitions
data:
  definitions.json: |
    {
      "queues": [
        {"name": "lineup_updates", "vhost": "/", "durable": true, "auto_delete": false, "arguments": {}},
        {"name": "waiver_actions", "vhost": "/", "durable": true, "auto_delete": false, "arguments": {}}
      ]
    }
  load_definitions.conf: |
    management.load_definitions = /etc/rabbitmq/definitions.json
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fantasy-broker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fantasy-broker
  template:
    metadata:
      labels:
        app: fantasy-broker
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3-management-alpine
          ports:
            - containerPort: 5672
              name: amqp
            - containerPort: 15672
              name: management
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: rabbitmq-user
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: rabbitmq-password
            # Force Erlang runtime to page messages to disk early to save cluster memory
            - name: RABBITMQ_VM_MEMORY_HIGH_WATERMARK_RELATIVE
              value: "0.4"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "1000m"
          volumeMounts:
            - name: broker-definitions
              mountPath: /etc/rabbitmq/definitions.json
              subPath: definitions.json
            - name: broker-definitions
              mountPath: /etc/rabbitmq/conf.d/20-load_definitions.conf
              subPath: load_definitions.conf
      volumes:
        - name: broker-definitions
          configMap:
            name: fantasy-broker-definitions
