apiVersion: v1
kind: Service
metadata:
  name: fantasy-db
  labels:
    app: fantasy-db
spec:
  ports:
    - port: 5432
      name: postgres
  clusterIP: None
  selector:
    app: fantasy-db
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: fantasy-db
spec:
  serviceName: "fantasy-db"
  replicas: 1
  selector:
    matchLabels:
      app: fantasy-db
  template:
    metadata:
      labels:
        app: fantasy-db
    spec:
      containers:
        - name: postgres
          image: timescale/timescaledb:latest-pg15
          args:
            - "-c"
            - "shared_buffers=128MB"
            - "-c"
            - "work_mem=16MB"
            - "-c"
            - "maintenance_work_mem=32MB"
            - "-c"
            - "effective_cache_size=256MB"
            - "-c"
            - "max_connections=20"
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              value: "fantasy_football"
            - name: POSTGRES_USER
              value: "bot_admin"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: database-credentials
                  key: postgres-password
          resources:
            requests:
              memory: "512Mi"
              cpu: "200m"
            limits:
              memory: "1024Mi"
              cpu: "1000m"
          volumeMounts:
            - name: db-storage
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: db-storage
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: 10Gi
