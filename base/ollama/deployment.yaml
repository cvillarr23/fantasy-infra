# Scaled to 0 replicas at rest -- an idle Deployment costs nothing, but a loaded 8B model
# resident in RAM 24/7 would permanently eat into the homelab node's budget for a tier that, by
# design, only ever fires once both free-tier cloud providers (WORKER-12) are already exhausted.
# On-demand scale-up (and, symmetrically, scale-down after 1h idle) is now handled by the KEDA
# HTTP Add-on interceptor rather than a manual RBAC-based call from llm_client.js -- see
# http-scaled-object.yaml. `replicas: 0` here is just the resting state KEDA scales from/to;
# it does not fight KEDA the way it briefly would have fought the old manual scale-up (Argo's
# existing ignoreDifferences on /spec/replicas already covers "something other than git manages
# this field," regardless of what that something is).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  labels:
    app: ollama
spec:
  replicas: 0
  # Recreate, not RollingUpdate: pvc.yaml's ReadWriteOnce model cache can only be mounted by one
  # pod at a time on this single-node cluster -- same reasoning as homelab-deployment's
  # PVC-backed apps (uptime-kuma, minecraft, qdrant).
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      containers:
        - name: ollama
          image: ollama/ollama:latest
          # Matches llm_client.js's DEFAULT_PROVIDER_PRIORITY model tag exactly so no
          # cross-repo config change is needed. All three pulls land in pvc.yaml's persistent
          # /root/.ollama cache, so this only pays the full download cost once -- a later
          # scale-up from 0 (KEDA's scaledownPeriod, or a pod reschedule) reuses the cache
          # instead of redownloading several GB of models on every cold start.
          #
          # llama3.1:8b is NOT retry-wrapped here: a failed pull makes this script exit non-zero
          # (via `&&` short-circuiting before `wait`), which exits the container and lets k8s's
          # normal restart-backoff retry the whole thing -- the same implicit retry behavior
          # this had before Token Guard's models were added.
          #
          # llama3.2:3b-instruct-q8_0 and nomic-embed-text ARE explicitly retry-wrapped (bounded,
          # 5 attempts with linear backoff): they run in a backgrounded subshell whose failure
          # would otherwise be silently swallowed forever with no retry and no visible signal,
          # since they don't gate the readiness probe below and can't trigger a container
          # restart the way the llama3.1:8b pull can. They're deliberately NOT gating readiness
          # either way: those two models are only used by the separate roo-coder/Token Guard MCP
          # tool (reached over Tailscale, see tailscale-ingress.yaml), not by llm_client.js's
          # scale-up poll loop -- gating readiness on all three pulls would slow every
          # fantasy-pipeline cold start waiting on models it never uses.
          command: ["/bin/sh", "-c"]
          args:
            - |
              ollama serve &
              sleep 5
              ollama pull llama3.1:8b && (
                i=0
                until ollama pull llama3.2:3b-instruct-q8_0; do
                  i=$((i + 1))
                  if [ "$i" -ge 5 ]; then
                    echo "giving up pulling llama3.2:3b-instruct-q8_0 after $i attempts" >&2
                    break
                  fi
                  sleep $((i * 5))
                done
                i=0
                until ollama pull nomic-embed-text; do
                  i=$((i + 1))
                  if [ "$i" -ge 5 ]; then
                    echo "giving up pulling nomic-embed-text after $i attempts" >&2
                    break
                  fi
                  sleep $((i * 5))
                done
              ) &
              wait
          ports:
            - containerPort: 11434
              name: ollama-api
          readinessProbe:
            # An httpGet against / would report Ready as soon as `ollama serve` starts --
            # while the multi-minute `ollama pull` above is still running -- so
            # llm_client.js's poll loop could see readyReplicas flip to 1 and issue its
            # request against a model that doesn't exist yet. `ollama list` only shows
            # models that have actually finished pulling, so this covers both server
            # availability and pull completion.
            exec:
              command: ["/bin/sh", "-c", "ollama list | grep -q llama3.1:8b"]
            initialDelaySeconds: 5
            periodSeconds: 5
            # Generous failure budget -- the model pull above can legitimately take minutes on a
            # cold cache, and this probe gates when llm_client.js's poll loop sees readyReplicas
            # flip to 1.
            failureThreshold: 60
          resources:
            requests:
              # Bumped alongside the limit below -- three resident models need more baseline
              # than one did.
              memory: "1Gi"
              cpu: "500m"
            limits:
              # CPU-only inference assumed -- no evidence of a GPU on this homelab node found
              # while planning WORKER-12's follow-up. Correct this (and add nvidia.com/gpu
              # requests/limits) if the node actually has one; CPU inference on an 8B model will
              # be noticeably slower than the cloud tiers this is a fallback for.
              #
              # Bumped 8Gi -> 12Gi for the two new models added alongside llama3.1:8b: under
              # Ollama's default keep_alive, all three can end up resident at once (~5-6GB for
              # llama3.1:8b + ~3.5GB for llama3.2:3b-instruct-q8_0 + ~300MB for nomic-embed-text,
              # roughly 9-10GB total). 12Gi leaves real margin without exceeding the node's
              # documented ~16GB of free headroom (32GB total, ~16GB normally in use elsewhere).
              memory: "12Gi"
              cpu: "4000m"
          volumeMounts:
            - name: ollama-models
              mountPath: /root/.ollama
      volumes:
        - name: ollama-models
          persistentVolumeClaim:
            claimName: ollama-models-pvc
