# Scaled to 0 replicas at rest -- an idle Deployment costs nothing, but a loaded 8B model
# resident in RAM 24/7 would permanently eat into the homelab node's budget for a tier that, by
# design, only ever fires once both free-tier cloud providers (WORKER-12) are already exhausted.
# On-demand scale-up (and, symmetrically, scale-down after 1h idle) is now handled by the KEDA
# HTTP Add-on interceptor rather than a manual RBAC-based call from llm_client.js -- see
# http-scaled-object.yaml. `replicas: 0` here is just the resting state KEDA scales from/to;
# it does not fight KEDA the way it briefly would have fought the old manual scale-up (Argo's
# existing ignoreDifferences on /spec/replicas already covers "something other than git manages
# this field," regardless of what that something is).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  labels:
    app: ollama
spec:
  replicas: 0
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      containers:
        - name: ollama
          image: ollama/ollama:latest
          # Pulls llama3.1:8b on first start (no persistent model cache/PVC yet -- a cold pull
          # adds to the already-long first-request latency llm_client.js's
          # OLLAMA_SCALE_UP_TIMEOUT_MS budgets for). Matches llm_client.js's
          # DEFAULT_PROVIDER_PRIORITY model tag exactly so no cross-repo config change is needed.
          #
          # llama3.2:3b-instruct-q8_0 and nomic-embed-text are pulled in a backgrounded
          # subshell, deliberately NOT gating the readiness probe below: those two models are
          # only used by the separate roo-coder/Token Guard MCP tool (reached over Tailscale,
          # see tailscale-ingress.yaml in this directory), not by llm_client.js's scale-up poll
          # loop. Gating readiness on all three pulls would slow every fantasy-pipeline cold
          # start waiting on models the fantasy pipeline itself never uses.
          command: ["/bin/sh", "-c"]
          args:
            - "ollama serve & sleep 5 && ollama pull llama3.1:8b && (ollama pull llama3.2:3b-instruct-q8_0 && ollama pull nomic-embed-text &) && wait"
          ports:
            - containerPort: 11434
              name: ollama-api
          readinessProbe:
            # An httpGet against / would report Ready as soon as `ollama serve` starts --
            # while the multi-minute `ollama pull` above is still running -- so
            # llm_client.js's poll loop could see readyReplicas flip to 1 and issue its
            # request against a model that doesn't exist yet. `ollama list` only shows
            # models that have actually finished pulling, so this covers both server
            # availability and pull completion.
            exec:
              command: ["/bin/sh", "-c", "ollama list | grep -q llama3.1:8b"]
            initialDelaySeconds: 5
            periodSeconds: 5
            # Generous failure budget -- the model pull above can legitimately take minutes on a
            # cold cache, and this probe gates when llm_client.js's poll loop sees readyReplicas
            # flip to 1.
            failureThreshold: 60
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              # CPU-only inference assumed -- no evidence of a GPU on this homelab node found
              # while planning WORKER-12's follow-up. Correct this (and add nvidia.com/gpu
              # requests/limits) if the node actually has one; CPU inference on an 8B model will
              # be noticeably slower than the cloud tiers this is a fallback for.
              #
              # NOT bumped for the two new models added above: this limit was sized for one
              # resident 8B model, but under Ollama's default keep_alive, all three models can
              # end up resident at once (~5-6GB for llama3.1:8b + a few GB more for the two
              # small Token Guard models). Revisit this against the node's actual free budget
              # before it's hit in practice -- flagging rather than guessing at a new number.
              memory: "8Gi" # generous headroom above the ~5-6GB an 8B quantized model needs
              cpu: "4000m"
