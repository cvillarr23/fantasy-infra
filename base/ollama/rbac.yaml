# Narrowly-scoped ServiceAccount + Role + RoleBinding so a fantasy-browser-worker pod can scale
# the ollama Deployment 0->1 on demand (WORKER-12's llm_client.js) via the k8s API instead of
# needing a standing pod or manual kubectl access -- same "default namespace only, no broader
# cluster permissions" scoping already used for INFRA-09's FastAPI-gateway RBAC. Only the
# `ollama` Deployment's scale/status subresources are reachable; nothing else in the cluster.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fantasy-browser-worker
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ollama-scaler
  namespace: default
rules:
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    resourceNames: ["ollama"]
    verbs: ["get", "update"]
  - apiGroups: ["apps"]
    resources: ["deployments/status"]
    resourceNames: ["ollama"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fantasy-browser-worker-ollama-scaler
  namespace: default
subjects:
  - kind: ServiceAccount
    name: fantasy-browser-worker
    namespace: default
roleRef:
  kind: Role
  name: ollama-scaler
  apiGroup: rbac.authorization.k8s.io
