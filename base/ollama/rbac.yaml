# ServiceAccount used as pod identity for the fantasy-browser-worker ScaledJob (see
# base/browser-worker/keda-scaledjob.yaml's serviceAccountName). It used to also carry a
# narrowly-scoped Role/RoleBinding granting `deployments/scale` on `ollama`, for
# llm_client.js's ensureOllamaScaledUp() to call the k8s API directly -- removed now that the
# KEDA HTTP Add-on interceptor triggers Ollama's on-demand scale-up itself based on request
# traffic (see http-scaled-object.yaml), so no pod needs that permission anymore.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fantasy-browser-worker
  namespace: default
