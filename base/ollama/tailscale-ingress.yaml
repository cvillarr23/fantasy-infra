# Exposes Ollama over the tailnet only, via tailscale-operator - same pattern as
# base/databases/rabbitmq-ingress.yaml and homelab-deployment's apps/openbao/ingress.yaml: no
# NodePort/public exposure, the tailnet itself is the auth boundary. Needed so the roo-coder
# (Token Guard) MCP server, running as a local process on dev laptops outside the cluster, can
# reach Ollama without a kubeconfig.
#
# Deliberately backs onto the KEDA HTTP Add-on interceptor's proxy Service (in the `keda`
# namespace -- see homelab-deployment's apps/keda-http-add-on), NOT the `ollama` Service
# directly, and this Ingress lives in the `keda` namespace itself rather than `default` so that
# backend reference can stay same-namespace (a plain networking.k8s.io/v1 Ingress can't
# reference a Service in a different namespace). Routing through the interceptor is what makes
# Token Guard's tailnet requests trigger Ollama's on-demand scale-up (see
# http-scaled-object.yaml) the same way fantasy-browser-worker's in-cluster requests do.
#
# The interceptor routes by the request's Host header, not by which Ingress/Service delivered
# it -- so Token Guard's HTTP client must explicitly set `Host: ollama.default.svc.cluster.local`
# on its requests (matching http-scaled-object.yaml's `hosts` entry) regardless of whatever
# hostname it actually dialed. This is what keeps the real tailnet MagicDNS name out of every
# manifest in this repo: it's only ever configured client-side (roo-coder's OLLAMA_BASE_URL env
# var, kept in the user's gitignored secrets file, never committed).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ollama
  namespace: keda
  annotations:
    tailscale.com/hostname: ollama
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: keda-add-ons-http-interceptor-proxy
      port:
        number: 8080
  tls:
    - hosts:
        - ollama
