# Lets the KEDA HTTP Add-on interceptor (homelab-deployment's apps/keda-http-add-on) manage
# this Deployment's replica count based on live request traffic, replacing the RBAC-based manual
# scale-up llm_client.js used to do itself (removed in this same change, see rbac.yaml). Any
# request that reaches the interceptor's proxy Service with a matching Host header triggers an
# on-demand scale-up (the interceptor queues the request until the pod is ready); after
# `scaledownPeriod` with no such requests, it scales back to 0.
#
# Deliberately consumer-agnostic: both fantasy-browser-worker's llm_client.js and the roo-coder
# (Token Guard) MCP server explicitly set this exact Host header on their outgoing requests
# (rather than relying on whatever their own transport/URL would send) specifically so this can
# stay a single well-known in-cluster value -- no tailnet-specific hostname ever needs to be
# committed here (see tailscale-ingress.yaml for how Token Guard's tailnet traffic reaches this
# same value without a literal tailnet name appearing anywhere in this repo).
#
# Argo CD's existing ignoreDifferences on this Deployment's /spec/replicas (see
# ../../overlays/production or wherever argo-controllers/fantasy-infra.yaml lives in
# homelab-deployment) already covers "something other than git sets replicas" generically -- no
# change needed there now that KEDA does this instead of llm_client.js's direct k8s API call.
apiVersion: http.keda.sh/v1alpha1
kind: HTTPScaledObject
metadata:
  name: ollama
  namespace: default
spec:
  hosts:
    - ollama.default.svc.cluster.local
  scaleTargetRef:
    name: ollama
    service: ollama
    port: 11434
  replicas:
    min: 0
    max: 1
  # 1 hour idle -> scale to zero. Set explicitly rather than relying on KEDA's own fallback
  # (commonly cited as 300s/5min in upstream docs, but not guaranteed by the CRD schema itself).
  scaledownPeriod: 3600
