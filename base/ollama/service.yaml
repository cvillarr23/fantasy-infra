# Named/ported to match llm_client.js's OLLAMA_URL default
# (http://ollama.default.svc.cluster.local:11434) exactly -- no fantasy-browser-worker-side
# config change needed for this to resolve.
apiVersion: v1
kind: Service
metadata:
  name: ollama
  labels:
    app: ollama
spec:
  ports:
    - port: 11434
      targetPort: 11434
      name: ollama-api
  selector:
    app: ollama
