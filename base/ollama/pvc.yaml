# Persists /root/.ollama (Ollama's model cache) across scale-to-zero. Without this, every
# scale-up after KEDA's 1h idle scaledown (see http-scaled-object.yaml) would redownload all
# three models -- several GB over the network -- before serving a single request, turning a
# routine on-demand wake-up into a multi-minute cold start on top of the download itself.
#
# 20Gi covers all three resident models (llama3.1:8b ~5-6GB, llama3.2:3b-instruct-q8_0 ~3.5GB,
# nomic-embed-text ~300MB) with real headroom for a model change later. Default StorageClass
# (host-path) enforces no size limit, so this is a starting budget, not a hard ceiling.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-models-pvc
  namespace: default
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 20Gi
