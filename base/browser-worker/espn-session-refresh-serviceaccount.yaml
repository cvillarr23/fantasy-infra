# Dedicated identity for the espn-session-refresh CronJob — deliberately separate from any other
# ServiceAccount in this namespace, since OpenBao binds a write-scoped role to it (see
# homelab-deployment's scripts/openbao-init-espn-refresher.sh). No other workload should use this
# ServiceAccount, or it inherits write access to secret/fantasy/espn.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: espn-session-refresh
  namespace: default
