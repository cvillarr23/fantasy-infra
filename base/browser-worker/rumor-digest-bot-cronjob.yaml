# Production schedule for rumor_digest_bot.js, which previously had no CronJob anywhere. Runs
# an hour before core-pipeline's fantasy-rumor-action-trigger (0 12 * * *) so today's
# rumor_signals rows exist before that job consumes them.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: rumor-digest-bot
  namespace: default
spec:
  schedule: "0 11 * * *" # 11:00 America/Chicago every day
  timeZone: "America/Chicago"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      # Finished Jobs (and their pods' logs) are removed after 7 days, so failures from
      # weeks ago stop cluttering `kubectl get jobs`; the run audit log keeps the history.
      ttlSecondsAfterFinished: 604800
      # Counts Pending time too: a pod that can't schedule (e.g. node CPU requests full) fails
      # the Job instead of sitting Pending forever, which under concurrencyPolicy: Forbid
      # silently skips every later run. 3600s is far above its normal runtime.
      activeDeadlineSeconds: 3600
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: fantasy-browser-worker
            component: rumor-digest-bot
        spec:
          restartPolicy: Never
          imagePullSecrets:
            - name: ghcr-pull-secret
          containers:
            - name: rumor-digest-bot
              image: ghcr.io/cvillarr23/fantasy-browser-worker:929083b992e3d2f95e74ee421ebcd75306f6ee31
              imagePullPolicy: Always
              command: ["node", "src/bots/rumor_digest_bot.js"]
              envFrom:
                - configMapRef:
                    name: fantasy-notify-config
                # NTFY_TOKEN for failure pushes; optional so the Job still runs before it exists.
                - secretRef:
                    name: ntfy-credentials
                    optional: true
              env:
                # Run audit log: which CronJob and Job this run belongs to (scheduled vs manual).
                - name: RUN_CRONJOB
                  value: "rumor-digest-bot"
                - name: RUN_K8S_JOB
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.labels['batch.kubernetes.io/job-name']
                # Same fantasy-db credentials every other CronJob/Job in this repo uses. Without
                # these, execution_log.js's pg Pool dials localhost:5432 inside the pod and
                # silently never writes a row.
                - name: DB_HOST
                  value: "fantasy-db.default.svc.cluster.local"
                - name: DB_NAME
                  value: "fantasy_football"
                - name: DB_USER
                  value: "bot_admin"
                - name: DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: database-credentials
                      key: postgres-password
                # Set directly rather than left to llm_client.js's in-process OpenBao fallback:
                # that path shells out to `bao`, which has no route to OpenBao from inside this
                # pod (no Vault agent sidecar) and always fails here.
                - name: GROQ_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: groq-api-key
                      key: groq_api_key
                - name: GEMINI_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: gemini-api-key
                      key: gemini_api_key
                # No ESPN_S2/SWID — unlike every other bot here, this one only touches
                # Postgres and the LLM fallback chain, never a browser page or ESPN's API.
                # OTLP export target for homelab-deployment's shared Tempo instance.
                - name: OTEL_EXPORTER_OTLP_ENDPOINT
                  value: "http://tempo.default.svc.cluster.local:4317"
                - name: OTEL_EXPORTER_OTLP_PROTOCOL
                  value: "grpc"
                - name: OTEL_SERVICE_NAME
                  value: "browser-worker"
              resources:
                requests:
                  memory: "128Mi" # no Chromium in this bot's process, unlike the browser-driving bots
                  cpu: "50m"
                limits:
                  memory: "512Mi"
                  cpu: "500m"
