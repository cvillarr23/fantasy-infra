apiVersion: keda.sh/v1alpha1
kind: ScaledJob
metadata:
  name: fantasy-browser-worker-scaler
  namespace: default
spec:
  jobTargetRef:
    parallelism: 1
    completions: 1
    backoffLimit: 2
    template:
      metadata:
        labels:
          app: fantasy-browser-worker
      spec:
        restartPolicy: OnFailure
        # Grants access to scale the ollama Deployment 0->1 on demand (WORKER-12's
        # llm_client.js) -- see rbac.yaml for the exact (narrowly-scoped) rules.
        # Previously unset, which meant this ran as the `default` ServiceAccount with no API
        # access at all.
        serviceAccountName: fantasy-browser-worker
        imagePullSecrets:
          - name: ghcr-pull-secret
        containers:
          - name: worker
            image: ghcr.io/cvillarr23/fantasy-browser-worker:929083b992e3d2f95e74ee421ebcd75306f6ee31
            imagePullPolicy: IfNotPresent
            envFrom:
              - configMapRef:
                  name: fantasy-league-config
            env:
              # Must stay env[0]: overlays/draft-day patches it by index (guarded by a JSON
              # patch `test` op, so moving it fails the build instead of silently patching the
              # wrong var). Exits the worker (code 0, so the Job completes) after this long with
              # no message in flight. Without it the worker is a run-forever daemon and every
              # Job KEDA starts stays Running after the queues drain -- 21 idle Jobs from one
              # waiver burst once held ~2.1 CPU of requests for 19h, starving Ollama's scale-up
              # and blocking CronJobs. Draft-day sets 0 to keep its warm browser.
              - name: IDLE_EXIT_SECONDS
                value: "120"
              - name: AMQP_URL
                valueFrom:
                  secretKeyRef:
                    name: rabbitmq-credentials
                    key: amqp-url
              # Writes execution_log rows on transaction completion (INFRA-06), read by
              # Grafana's worker execution health panel. Same DB_* names and bot_admin
              # credential fastapi-deployment.yaml already uses -- the worker is inside
              # the same trust boundary as core-pipeline, not the read-only Grafana path.
              - name: DB_HOST
                value: "fantasy-db.default.svc.cluster.local"
              - name: DB_NAME
                value: "fantasy_football"
              - name: DB_USER
                value: "bot_admin"
              - name: DB_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: database-credentials
                    key: postgres-password
              - name: ESPN_S2
                valueFrom:
                  secretKeyRef:
                    name: espn-session-secrets
                    key: espn_s2
              - name: SWID
                valueFrom:
                  secretKeyRef:
                    name: espn-session-secrets
                    key: swid
              # OTLP export target for homelab-deployment's shared Tempo instance
              # (homelab-deployment#5/#6) -- endpoint + service name only, actual
              # span emission (and RabbitMQ trace-context propagation) is WORKER-09.
              # OTEL_EXPORTER_OTLP_ENDPOINT must be "http://", not "grpc://" -- the Node gRPC
              # exporter's credential resolution keys off an http:// prefix specifically to pick
              # plaintext channel credentials; anything else falls through to TLS credentials,
              # which fails against Tempo's unencrypted in-cluster OTLP receiver.
              - name: OTEL_EXPORTER_OTLP_ENDPOINT
                value: "http://tempo.default.svc.cluster.local:4317"
              - name: OTEL_EXPORTER_OTLP_PROTOCOL
                value: "grpc"
              - name: OTEL_SERVICE_NAME
                value: "browser-worker"
            resources:
              requests:
                memory: "256Mi"
                # 50m, not more: requests are reserved whether or not the worker is busy, and
                # the 1-CPU limit below still lets an active Chromium burst into idle node CPU.
                cpu: "50m"
              limits:
                memory: "1200Mi" # Hard ceiling preventing Chromium memory bloat from stalling the node
                cpu: "1000m"

  # KEDA Polling and Scaling parameters
  pollingInterval: 10 # Checks the RabbitMQ queue every 10 seconds
  # Caps concurrent workers; RabbitMQ holds any backlog beyond that and the running workers drain
  # it one message at a time (prefetch 1). Without a cap KEDA's default is 100 -- one Job per
  # queued message -- so a 21-message waiver burst started 21 Jobs at once.
  maxReplicaCount: 3
  successfulJobsHistoryLimit: 5
  failedJobsHistoryLimit: 5

  triggers:
    - type: rabbitmq
      metadata:
        queueName: lineup_updates
        mode: QueueLength # queueLength is deprecated in favor of mode + value
        value: "1" # 1 job per queued message, up to maxReplicaCount
      authenticationRef:
        name: rabbitmq-trigger-auth
    - type: rabbitmq
      metadata:
        queueName: waiver_actions
        mode: QueueLength
        value: "1"
      authenticationRef:
        name: rabbitmq-trigger-auth
    - type: rabbitmq
      metadata:
        queueName: draft_targets
        mode: QueueLength
        value: "1"
      authenticationRef:
        name: rabbitmq-trigger-auth
    # The worker also consumes these four (see fantasy-browser-worker src/queue/connection.js),
    # but without triggers a message on them only got handled if a worker happened to be up for
    # one of the queues above. Not broker-owned (the worker asserts them durable on startup), so
    # on a fresh broker these scalers error until the first worker has run; the triggers above
    # keep working meanwhile.
    - type: rabbitmq
      metadata:
        queueName: trade_evaluations
        mode: QueueLength
        value: "1"
      authenticationRef:
        name: rabbitmq-trigger-auth
    - type: rabbitmq
      metadata:
        queueName: trade_negotiations
        mode: QueueLength
        value: "1"
      authenticationRef:
        name: rabbitmq-trigger-auth
    - type: rabbitmq
      metadata:
        queueName: llm_requests
        mode: QueueLength
        value: "1"
      authenticationRef:
        name: rabbitmq-trigger-auth
    - type: rabbitmq
      metadata:
        queueName: trade_submissions
        mode: QueueLength
        value: "1"
      authenticationRef:
        name: rabbitmq-trigger-auth
