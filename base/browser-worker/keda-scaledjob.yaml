apiVersion: keda.sh/v1alpha1
kind: ScaledJob
metadata:
  name: fantasy-browser-worker-scaler
  namespace: default
spec:
  jobTargetRef:
    parallelism: 1
    completions: 1
    backoffLimit: 2
    template:
      metadata:
        labels:
          app: fantasy-browser-worker
      spec:
        restartPolicy: OnFailure
        imagePullSecrets:
          - name: ghcr-pull-secret
        containers:
          - name: worker
            image: ghcr.io/cvillarr23/fantasy-browser-worker:latest
            imagePullPolicy: IfNotPresent
            envFrom:
              - configMapRef:
                  name: fantasy-league-config
            env:
              - name: AMQP_URL
                valueFrom:
                  secretKeyRef:
                    name: rabbitmq-credentials
                    key: amqp-url
              # Writes execution_log rows on transaction completion (INFRA-06), read by
              # Grafana's worker execution health panel. Same DB_* names and bot_admin
              # credential fastapi-deployment.yaml already uses -- the worker is inside
              # the same trust boundary as core-pipeline, not the read-only Grafana path.
              - name: DB_HOST
                value: "fantasy-db.default.svc.cluster.local"
              - name: DB_NAME
                value: "fantasy_football"
              - name: DB_USER
                value: "bot_admin"
              - name: DB_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: database-credentials
                    key: postgres-password
              - name: ESPN_S2
                valueFrom:
                  secretKeyRef:
                    name: espn-session-secrets
                    key: espn_s2
              - name: SWID
                valueFrom:
                  secretKeyRef:
                    name: espn-session-secrets
                    key: swid
              # OTLP export target for homelab-deployment's shared Tempo instance
              # (homelab-deployment#5/#6) -- endpoint + service name only, actual
              # span emission (and RabbitMQ trace-context propagation) is WORKER-09.
              - name: OTEL_EXPORTER_OTLP_ENDPOINT
                value: "http://tempo.default.svc.cluster.local:4317"
              - name: OTEL_EXPORTER_OTLP_PROTOCOL
                value: "grpc"
              - name: OTEL_SERVICE_NAME
                value: "browser-worker"
            resources:
              requests:
                memory: "256Mi"
                cpu: "100m"
              limits:
                memory: "1200Mi" # Hard ceiling preventing Chromium memory bloat from stalling the node
                cpu: "1000m"

  # KEDA Polling and Scaling parameters
  pollingInterval: 10 # Checks the RabbitMQ queue every 10 seconds
  successfulJobsHistoryLimit: 5
  failedJobsHistoryLimit: 5

  triggers:
    - type: rabbitmq
      metadata:
        queueName: lineup_updates
        mode: QueueLength # queueLength is deprecated in favor of mode + value
        value: "1" # Spawns 1 job pod per message in the queue
      authenticationRef:
        name: rabbitmq-trigger-auth
    - type: rabbitmq
      metadata:
        queueName: waiver_actions
        mode: QueueLength
        value: "1"
      authenticationRef:
        name: rabbitmq-trigger-auth
