# ServiceAccount used as pod identity for the fantasy-browser-worker ScaledJob (see
# keda-scaledjob.yaml's serviceAccountName).
#
# The Role/RoleBinding below granting `deployments/scale` on `ollama` is no longer used by new
# code -- the KEDA HTTP Add-on interceptor triggers Ollama's on-demand scale-up itself now (see
# homelab-deployment's apps/ollama/http-scaled-object.yaml), so llm_client.js's
# ensureOllamaScaledUp() was removed. Deliberately KEPT rather than removed, though: the old
# worker image (which still calls it) may still be running during the window between this PR
# merging and the companion fantasy-browser-worker image rollout landing, and removing this out
# from under it would turn a routine deploy into an outage for that tier (Forbidden instead of a
# clean scale-up). Safe, low-cost to leave in place once both are fully rolled out; revisit
# removing it then if desired.
#
# Ollama itself moved to a standalone ArgoCD app (homelab-deployment's apps/ollama) since it's
# shared infra (this tier's own LLM fallback, plus the separate roo-coder/Token Guard MCP
# server), not fantasy-specific -- but this Role's `resourceNames: ["ollama"]` still resolves
# correctly: it's a plain namespace-scoped RBAC rule against a Deployment named `ollama` in
# `default`, unaffected by which ArgoCD Application manages that Deployment's manifest.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fantasy-browser-worker
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ollama-scaler
  namespace: default
rules:
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    resourceNames: ["ollama"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments/status"]
    resourceNames: ["ollama"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fantasy-browser-worker-ollama-scaler
  namespace: default
subjects:
  - kind: ServiceAccount
    name: fantasy-browser-worker
    namespace: default
roleRef:
  kind: Role
  name: ollama-scaler
  apiGroup: rbac.authorization.k8s.io
