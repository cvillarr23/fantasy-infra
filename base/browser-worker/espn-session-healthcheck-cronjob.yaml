# fantasy-browser-worker issue #7: periodically confirms the stored espn_s2/SWID cookies still
# authenticate, and fails loudly if they don't — so a human finds out and re-extracts them by
# hand, rather than the pipeline silently failing ESPN auth with no warning (possibly on draft
# day). Uses the same read-only cookie injection every other bot already gets via
# espn-session-secrets — no dedicated ServiceAccount/OpenBao role needed.
#
# Originally planned as a fully automated re-login + cookie refresh instead of just a check, but
# that turned out not to be viable: ESPN's login is gated by invisible reCAPTCHA Enterprise,
# specifically designed to block automated submissions. See the linked PR for details.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: espn-session-healthcheck
  namespace: default
spec:
  schedule: "0 6 * * 1" # 06:00 UTC every Monday — frequent enough to catch a dead session well before a Sunday draft/matchup
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      # Finished Jobs (and their pods' logs) are removed after 7 days, so failures from
      # weeks ago stop cluttering `kubectl get jobs`; the run audit log keeps the history.
      ttlSecondsAfterFinished: 604800
      # Counts Pending time too: a pod that can't schedule (e.g. node CPU requests full) fails
      # the Job instead of sitting Pending forever, which under concurrencyPolicy: Forbid
      # silently skips every later run. 3600s is far above its normal runtime.
      activeDeadlineSeconds: 3600
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: fantasy-browser-worker
            component: espn-session-healthcheck
        spec:
          restartPolicy: Never
          imagePullSecrets:
            - name: ghcr-pull-secret
          containers:
            - name: healthcheck
              image: ghcr.io/cvillarr23/fantasy-browser-worker:929083b992e3d2f95e74ee421ebcd75306f6ee31
              imagePullPolicy: Always
              command: ["node", "src/bots/check_espn_session.js"]
              envFrom:
                - configMapRef:
                    name: fantasy-league-config
              env:
                # Run audit log: which CronJob and Job this run belongs to (scheduled vs manual).
                - name: RUN_CRONJOB
                  value: "espn-session-healthcheck"
                - name: RUN_K8S_JOB
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.labels['batch.kubernetes.io/job-name']
                # Same fantasy-db credentials the browser-worker ScaledJob uses
                # (keda-scaledjob.yaml). Without these, src/db/execution_log.js's pg Pool falls
                # back to libpq defaults and dials localhost:5432 inside the pod, so every run
                # logged "ECONNREFUSED ::1:5432" and wrote no execution_log row -- leaving
                # Grafana's worker execution health panel blind to this CronJob entirely.
                - name: DB_HOST
                  value: "fantasy-db.default.svc.cluster.local"
                - name: DB_NAME
                  value: "fantasy_football"
                - name: DB_USER
                  value: "bot_admin"
                - name: DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: database-credentials
                      key: postgres-password
                - name: ESPN_S2
                  valueFrom:
                    secretKeyRef:
                      name: espn-session-secrets
                      key: espn_s2
                - name: SWID
                  valueFrom:
                    secretKeyRef:
                      name: espn-session-secrets
                      key: swid
                # OTLP export target for homelab-deployment's shared Tempo instance -- same
                # convention INFRA-10 already wired for the browser-worker ScaledJob
                # (keda-scaledjob.yaml) and the core-pipeline workloads. Endpoint must be
                # "http://", not "grpc://" -- the Node gRPC exporter's credential resolution
                # keys off an http:// prefix specifically to pick plaintext channel credentials;
                # anything else falls through to TLS credentials, which fails against Tempo's
                # unencrypted in-cluster OTLP receiver.
                - name: OTEL_EXPORTER_OTLP_ENDPOINT
                  value: "http://tempo.default.svc.cluster.local:4317"
                - name: OTEL_EXPORTER_OTLP_PROTOCOL
                  value: "grpc"
                - name: OTEL_SERVICE_NAME
                  value: "browser-worker"
                - name: ESPN_LEAGUE_ID
                  valueFrom:
                    secretKeyRef:
                      name: espn-session-secrets
                      key: ESPN_LEAGUE_ID
                - name: ESPN_TEAM_ID
                  valueFrom:
                    secretKeyRef:
                      name: espn-session-secrets
                      key: ESPN_TEAM_ID
              resources:
                requests:
                  memory: "256Mi"
                  cpu: "100m"
                limits:
                  memory: "1200Mi"
                  cpu: "1000m"
