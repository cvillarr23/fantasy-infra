apiVersion: v1
kind: Service
metadata:
  name: fantasy-web-ui
  labels:
    app: fantasy-web-ui
spec:
  type: ClusterIP
  # Pinned: homelab-deployment's cloudflared tunnel (ui.example.com, apps/cloudflared/)
  # runs hostNetwork with the node's resolv.conf, so it can't resolve cluster DNS and
  # routes to this IP directly. Changing it breaks that route - update both together.
  clusterIP: 10.152.183.104
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
      name: http
  selector:
    app: fantasy-web-ui
