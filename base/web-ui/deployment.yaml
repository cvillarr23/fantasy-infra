apiVersion: apps/v1
kind: Deployment
metadata:
  name: fantasy-web-ui
  labels:
    app: fantasy-web-ui
  annotations:
    # Image Updater annotations for managing container image digests
    argocd-image-updater.argoproj.io/image-list: web-ui=ghcr.io/cvillarr23/fantasy-web-ui
    argocd-image-updater.argoproj.io/web-ui.update-strategy: digest
    argocd-image-updater.argoproj.io/web-ui.allow-tags: regexp:^[a-f0-9]{40}$
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fantasy-web-ui
  template:
    metadata:
      labels:
        app: fantasy-web-ui
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: web-ui
          image: ghcr.io/cvillarr23/fantasy-web-ui:7af08a219100f3c301ad3def45ae1bbf303fe282
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              name: http

          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10

          resources:
            requests:
              memory: "32Mi"
              cpu: "25m"
            limits:
              memory: "128Mi"
              cpu: "250m"
