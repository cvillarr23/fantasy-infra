# Daily/weekly CronJobs: alert more than 2h after the expected schedule (#75).
# kube-state-metrics applies schedule and timeZone; no UTC hour is hardcoded.
# Separate 20m/30m/60m rules cover frequent jobs. Suspended jobs also alert.
# One rule per provisioning file/group; see docs/cronjob-alerts.md.
apiVersion: v1
kind: ConfigMap
metadata:
  name: fantasy-cronjob-missed-schedule-alert
  namespace: default
  labels:
    grafana_alert: "1"
data:
  fantasy-cronjob-missed-schedule.yaml: |
    apiVersion: 1
    groups:
      - orgId: 1
        name: fantasy-cronjob-missed-schedule
        folder: Fantasy
        interval: 5m
        rules:
          - uid: fantasy-cronjob-missed-schedule
            title: Fantasy CronJob missed its scheduled run
            condition: C
            for: 0m
            # No kube-state-metrics data means a missed run can't be ruled out.
            noDataState: Alerting
            execErrState: Error
            annotations:
              summary: >-
                CronJob {{ $labels.cronjob }} did not run: expected
                {{ humanizeDuration $values.B.Value }} ago. Last successful run
                {{ humanizeTimestamp $values.E.Value }}; suspended={{ $values.G.Value }}.
              runbook_url: https://github.com/cvillarr23/fantasy-infra/blob/main/docs/cronjob-alerts.md#fantasy-cronjob-missed-its-scheduled-run
            data:
              # Seconds since the run kube-state-metrics expected next.
              - refId: A
                relativeTimeRange: {from: 600, to: 0}
                datasourceUid: prometheus
                model:
                  expr: >
                    time() - max by (exported_namespace, cronjob) (
                      kube_cronjob_next_schedule_time{cronjob=~"fantasy-(draft-prep-refresher|lineup-optimizer|rumor-action-trigger|sync-actual-scores|sync-actual-scores-reconcile|weekly-ingestor|weekly-waiver-trigger)|espn-session-healthcheck|rumor-digest-bot|trade-scan|trade-inbox"}
                    )
                  instant: true
              - refId: B
                datasourceUid: __expr__
                model:
                  type: reduce
                  expression: A
                  reducer: last
              - refId: C
                datasourceUid: __expr__
                model:
                  type: threshold
                  expression: B
                  conditions:
                    - evaluator: {type: gt, params: [7200]}
              # Context only, for the summary.
              - refId: D
                relativeTimeRange: {from: 600, to: 0}
                datasourceUid: prometheus
                model:
                  expr: >
                    max by (exported_namespace, cronjob) (
                      kube_cronjob_status_last_successful_time{cronjob=~"fantasy-(draft-prep-refresher|lineup-optimizer|rumor-action-trigger|sync-actual-scores|sync-actual-scores-reconcile|weekly-ingestor|weekly-waiver-trigger)|espn-session-healthcheck|rumor-digest-bot|trade-scan|trade-inbox"}
                    )
                  instant: true
              - refId: E
                datasourceUid: __expr__
                model:
                  type: reduce
                  expression: D
                  reducer: last
              - refId: F
                relativeTimeRange: {from: 600, to: 0}
                datasourceUid: prometheus
                model:
                  expr: >
                    max by (exported_namespace, cronjob) (
                      kube_cronjob_spec_suspend{cronjob=~"fantasy-(draft-prep-refresher|lineup-optimizer|rumor-action-trigger|sync-actual-scores|sync-actual-scores-reconcile|weekly-ingestor|weekly-waiver-trigger)|espn-session-healthcheck|rumor-digest-bot|trade-scan|trade-inbox"}
                    )
                  instant: true
              - refId: G
                datasourceUid: __expr__
                model:
                  type: reduce
                  expression: F
                  reducer: last
