apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Grafana alert rules, discovered by homelab-deployment's alert-sidecar via the
# grafana_alert: "1" label (see docs/cronjob-alerts.md).
resources:
  - cronjob-job-failed-alert.yaml
  - cronjob-missed-schedule-alert.yaml
  - rumor-action-outcome-alert.yaml
  - launcher-heartbeat-alert.yaml
  - launcher-dlq-alert.yaml
  - launcher-queue-depth-unknown-alert.yaml
  - launcher-job-runs-backlog-alert.yaml
  - launcher-chain-max-duration-alert.yaml
  - launcher-run-failed-critical-alert.yaml
  - launcher-run-failed-warning-alert.yaml
