apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Grafana alert rules, discovered by homelab-deployment's alert-sidecar via the
# grafana_alert: "1" label (see docs/cronjob-alerts.md).
resources:
  - cronjob-job-failed-alert.yaml
  - cronjob-missed-schedule-alert.yaml
  - cronjob-missed-schedule-rapid-status-syncer-alert.yaml
  - cronjob-missed-schedule-stale-draft-job-sweeper-alert.yaml
  - cronjob-missed-schedule-rumor-syncer-alert.yaml
