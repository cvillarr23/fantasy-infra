# GENERATED by scripts/generate-launcher-alerts.py from base/launcher/catalog.yaml; do not edit.
# One series per job. Fires once per run_log row that ended failure or timeout on its last attempt,
# or was skipped for a reason that needs a person (not a pause, or a skip the chain's own timeout
# or cancel already alerts on). A failure the watcher will still retry doesn't alert. Level `warning`.
# Runbook: docs/cronjob-alerts.md#launcher-run-failed
apiVersion: v1
kind: ConfigMap
metadata:
  name: fantasy-launcher-run-failed-warning-alert
  namespace: default
  labels:
    grafana_alert: "1"
data:
  launcher-run-failed-warning.yaml: |
    apiVersion: 1
    groups:
    - orgId: 1
      name: launcher-run-failed-warning
      folder: Fantasy
      interval: 5m
      rules:
      - uid: launcher-run-failed-warning
        title: Launcher run failed (warning jobs)
        condition: C
        for: 0m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: '{{ $labels.job_name }}: {{ $values.B.Value }} run(s) failed, timed out or were skipped in the last 10 minutes.'
          runbook_url: https://github.com/cvillarr23/fantasy-infra/blob/main/docs/cronjob-alerts.md#launcher-run-failed
        data:
        - refId: A
          relativeTimeRange:
            from: 600
            to: 0
          datasourceUid: FantasyFootballDB
          model:
            refId: A
            format: table
            rawQuery: true
            rawSql: |-
              SELECT r.job_name, COUNT(*)::double precision AS value
              FROM run_log r
              JOIN unnest(ARRAY['espn-session-healthcheck', 'metrics-extractor', 'projections-refresh', 'rapid-status-syncer', 'rumor-action-trigger', 'rumor-digest-bot', 'rumor-syncer', 'stale-draft-job-sweeper', 'sync-actual-scores', 'sync-league']::text[], ARRAY[2, 2, 1, 2, 3, 2, 2, 2, 2, 2]::int[]) AS j(job_name, max_attempts) ON j.job_name = r.job_name
              WHERE r.finished_at > now() - interval '10 minutes'
                AND (
                  (
                    r.status IN ('failure', 'timeout')
                    AND (
                      r.attempt >= j.max_attempts
                      OR (r.chain_root_id IS NOT NULL AND r.chain_root_id <> r.id
                    AND NOT EXISTS (SELECT 1 FROM run_log root WHERE root.id = r.chain_root_id AND root.status = 'running'))
                    )
                  )
                  OR (r.status = 'skipped' AND COALESCE(r.end_reason, '') NOT IN ('paused', 'chain_step', 'max_duration', 'chain_ended'))
                )
              GROUP BY r.job_name;
        - refId: B
          datasourceUid: __expr__
          model:
            type: reduce
            expression: A
            reducer: last
        - refId: C
          datasourceUid: __expr__
          model:
            type: threshold
            expression: B
            conditions:
            - evaluator:
                type: gt
                params:
                - 0
