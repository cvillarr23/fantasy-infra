# Covers every base/ CronJob not yet on the launcher (fantasy-infra#75); initial slice: #97/#98.
# Regex groups the fantasy- names plus the browser-worker names.
# Fires when the most recent Job of a watched CronJob has failed.
# Only the latest Job per CronJob counts: failed Jobs linger for failedJobsHistoryLimit,
# so an old failure followed by successes must not keep firing. The alert resolves on
# the next successful run. A successful Job never matches, including an optimizer run
# that publishes zero swaps ("already optimal"). fantasy-core-pipeline#178 makes missing
# optimizer input exit nonzero, so that case lands here as a failed Job; #181 does the
# same for the waiver trigger's empty bench/free-agent pools (fantasy-infra#101).
#
# To cover another CronJob (fantasy-infra#75), add it to the owner_name/cronjob regex in
# both queries. Runbook: docs/cronjob-alerts.md.
apiVersion: v1
kind: ConfigMap
metadata:
  name: fantasy-cronjob-job-failed-alert
  namespace: default
  labels:
    grafana_alert: "1"
data:
  fantasy-cronjob-job-failed.yaml: |
    apiVersion: 1
    groups:
      - orgId: 1
        name: fantasy-cronjob-job-failed
        folder: Fantasy
        interval: 5m
        rules:
          - uid: fantasy-cronjob-job-failed
            title: Fantasy CronJob latest Job failed
            condition: C
            for: 0m
            noDataState: OK
            execErrState: Error
            annotations:
              summary: >-
                Job {{ $labels.job_name }} (CronJob {{ $labels.owner_name }}) failed.
                Created {{ humanizeTimestamp $values.B.Value }}; last successful run
                {{ humanizeTimestamp $values.E.Value }}.
              runbook_url: https://github.com/cvillarr23/fantasy-infra/blob/main/docs/cronjob-alerts.md#fantasy-cronjob-latest-job-failed
            data:
              # Latest Job per CronJob (by creation time) that has a Failed=true
              # condition. Value is the Job's creation time.
              - refId: A
                relativeTimeRange: {from: 600, to: 0}
                datasourceUid: prometheus
                model:
                  expr: >
                    (
                      (kube_job_created * on (exported_namespace, job_name) group_left (owner_name)
                        max by (exported_namespace, job_name, owner_name) (kube_job_owner{owner_kind="CronJob", owner_name=~"fantasy-(sync-actual-scores-reconcile|trade-candidates|trade-candidates-prescan)|trade-scan|trade-inbox"}))
                      == on (exported_namespace, owner_name) group_left ()
                      max by (exported_namespace, owner_name) (
                        kube_job_created * on (exported_namespace, job_name) group_left (owner_name)
                          max by (exported_namespace, job_name, owner_name) (kube_job_owner{owner_kind="CronJob", owner_name=~"fantasy-(sync-actual-scores-reconcile|trade-candidates|trade-candidates-prescan)|trade-scan|trade-inbox"})
                      )
                    )
                    and on (exported_namespace, job_name) (kube_job_failed{condition="true"} == 1)
                  instant: true
              - refId: B
                datasourceUid: __expr__
                model:
                  type: reduce
                  expression: A
                  reducer: last
              - refId: C
                datasourceUid: __expr__
                model:
                  type: threshold
                  expression: B
                  conditions:
                    - evaluator: {type: gt, params: [0]}
              # Context only: last successful run per CronJob, relabeled to owner_name
              # so it joins to the alerting series for the summary.
              - refId: D
                relativeTimeRange: {from: 600, to: 0}
                datasourceUid: prometheus
                model:
                  expr: >
                    max by (exported_namespace, owner_name) (
                      label_replace(kube_cronjob_status_last_successful_time{cronjob=~"fantasy-(sync-actual-scores-reconcile|trade-candidates|trade-candidates-prescan)|trade-scan|trade-inbox"},
                        "owner_name", "$1", "cronjob", "(.*)")
                    )
                  instant: true
              - refId: E
                datasourceUid: __expr__
                model:
                  type: reduce
                  expression: D
                  reducer: last
