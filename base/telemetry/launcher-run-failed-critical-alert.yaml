# GENERATED by scripts/generate-launcher-alerts.py from base/launcher/catalog.yaml; do not edit.
# Fires once per run_log row that ended failure or timeout, or was skipped for a reason that
# needs a person (not `paused`, and not `chain_step`, a slot another chain covers). Runs retried
# by the launcher don't alert until their last attempt ends. Level `critical`.
# Runbook: docs/cronjob-alerts.md#launcher-run-failed
apiVersion: v1
kind: ConfigMap
metadata:
  name: fantasy-launcher-run-failed-critical-alert
  namespace: default
  labels:
    grafana_alert: "1"
data:
  launcher-run-failed-critical.yaml: |
    apiVersion: 1
    groups:
    - orgId: 1
      name: launcher-run-failed-critical
      folder: Fantasy
      interval: 5m
      rules:
      - uid: launcher-run-failed-critical
        title: Launcher run failed (critical jobs)
        condition: C
        for: 0m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: '{{ $values.B.Value }} critical job run(s) failed, timed out or were skipped in the last 10 minutes.'
          runbook_url: https://github.com/cvillarr23/fantasy-infra/blob/main/docs/cronjob-alerts.md#launcher-run-failed
        data:
        - refId: A
          relativeTimeRange:
            from: 600
            to: 0
          datasourceUid: FantasyFootballDB
          model:
            refId: A
            format: table
            rawQuery: true
            rawSql: |-
              SELECT COUNT(*)::double precision AS value
              FROM run_log
              WHERE job_name = ANY(ARRAY[]::text[])
                AND finished_at > now() - interval '10 minutes'
                AND (
                  status IN ('failure', 'timeout')
                  OR (status = 'skipped' AND COALESCE(end_reason, '') NOT IN ('paused', 'chain_step'))
                );
        - refId: B
          datasourceUid: __expr__
          model:
            type: reduce
            expression: A
            reducer: last
        - refId: C
          datasourceUid: __expr__
          model:
            type: threshold
            expression: B
            conditions:
            - evaluator:
                type: gt
                params:
                - 0
