# Job catalog read by the launcher at startup (docs/adr/0001-unified-job-launcher.md).
version: 1
# Active KEDA browser worker Jobs count toward max_concurrent_pods, so both share one pod budget.
global: {max_concurrent_pods: 2, counted_k8s_jobs: ["scaledjob.keda.sh/name=fantasy-browser-worker-scaler"], max_deadline: 2h, start_timeout: 10m, manual_queue_ttl: 30m}
# NFL regular-season weeks; the scheduler maps them to game dates. The calendar reads only
# regular-season games, so there is no playoffs window.
seasons:
  regular: {start: 1, end: 18}
profiles:
  core: {image: CORE_IMAGE, secrets: [db, espn, redis, trigger-api, amqp, league-config]}
  # The fantasy-core-pipeline SA is bound to draft-sync-orchestrator (jobs get/list/delete),
  # which the stale draft Job sweeper needs; as `default` every run 403s listing jobs.batch.
  core-ops: {image: CORE_IMAGE, serviceAccount: fantasy-core-pipeline, secrets: [db, redis, trigger-api, amqp]}
  # Browser bots: stored ESPN session state and the browser-worker SA. Only the scan gets LLM keys.
  # amqp lets the inbox publish trade.offer_received to job_events.
  worker: {image: WORKER_IMAGE, serviceAccount: fantasy-browser-worker, secrets: [db, espn, notify, league-config, amqp], volumes: [espn-session-state]}
  worker-scan: {image: WORKER_IMAGE, serviceAccount: fantasy-browser-worker, secrets: [db, espn, notify, league-config, llm], volumes: [espn-session-state]}
  # Worker bots that never drive a browser, so no browser-worker SA or stored session state.
  worker-session-check: {image: WORKER_IMAGE, secrets: [db, espn, notify, league-config]}
  # amqp lets the digest publish rumor.signal_created to job_events.
  worker-llm: {image: WORKER_IMAGE, secrets: [db, llm, notify, amqp]}
defaults: {executor: pod, overlap: forbid, max_attempts: 1, deadline: 1h, alert: warning}
# Deadlines sit just under each schedule interval, as the CronJobs' activeDeadlineSeconds did
# (rumor-action-trigger's is shorter, see below), and max_attempts: 2 keeps their backoffLimit: 1.
# Frequent jobs never fire a missed slot.
jobs:
  rumor-syncer:
    profile: core
    command: [python, -m, src.ingestion.sync_rumors]
    deadline: 25m
    max_attempts: 2
    schedules:
      - {cron: '*/30 * * * *', tz: America/Chicago, catch_up: 0s}
  rapid-status-syncer:
    profile: core
    command: [python, -m, src.ingestion.sync_players]
    deadline: 9m
    max_attempts: 2
    schedules:
      - {cron: '*/10 * * * 4,0,1', tz: America/Chicago, catch_up: 0s}
  stale-draft-job-sweeper:
    profile: core-ops
    command: [python, -m, src.ops.sweep_stale_draft_jobs]
    deadline: 14m
    max_attempts: 2
    schedules:
      - {cron: '*/15 * * * *', tz: America/Chicago, catch_up: 0s}
  espn-session-healthcheck:
    profile: worker-session-check
    command: [node, src/bots/check_espn_session.js]
    max_attempts: 2
    resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: 1000m, memory: 1200Mi}}
    schedules:
      # 06:00 UTC Monday, the CronJob's controller-timezone slot.
      - {cron: '0 6 * * 1', tz: UTC, catch_up: 2h}
  rumor-digest-bot:
    profile: worker-llm
    command: [node, src/bots/rumor_digest_bot.js]
    max_attempts: 2
    resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {cpu: 500m, memory: 512Mi}}
    schedules:
      - {cron: '0 11 * * *', tz: America/Chicago, catch_up: 2h}
  sync-league:
    profile: core
    command: [python, -m, src.ingestion.sync_league, --season, $(CURRENT_YEAR)]
    max_attempts: 2
  metrics-extractor:
    profile: core
    command: [python, -m, src.ingestion.metrics_extractor]
    max_attempts: 2
  # Tuesday's run is a chain step. Friday's reconcile picks up a week Tuesday couldn't store yet
  # (stats not official, a postponed game) plus ESPN stat corrections, before the trade jobs score
  # opponents: catch_up 1h ends both attempts by 12:00, ahead of the 12:30 candidates. A week ESPN
  # hasn't finished fails the run instead of being guessed, and earlier weeks stay committed.
  # Retrying is safe: each week is replaced in one transaction under an advisory lock.
  sync-actual-scores:
    profile: core
    command: [python, -m, src.ingestion.sync_actual_scores, --season, $(CURRENT_YEAR)]
    deadline: 30m
    max_attempts: 2
    schedules:
      - {cron: '0 10 * * 5', tz: America/Chicago, catch_up: 1h}
  # Each run fans out one child per week of the horizon (the upcoming week plus 0-3); the
  # children run in parallel within max_concurrent_pods. One attempt per child: the next daily
  # run refreshes every week again.
  projections-refresh:
    profile: core
    command: [python, -m, src.jobs.draft_prep_refresh]
    params: {week_offset: 'int?'}
    fan_out: {param: week_offset, values: [0, 1, 2, 3]}
    schedules:
      - {cron: '0 18 * * *', tz: America/Chicago, catch_up: 1h}
  # Retrying lineup, waivers and rumor actions is safe: each publish dedupes on an idempotency
  # key scoped to JOB_NAME (lineup, rumor) or the week (waivers), and JOB_NAME stays the same
  # across a run's attempts.
  lineup-optimizer:
    profile: core
    command: [python, -m, src.optimization.lineup_solver]
    params: {week: 'int?', dry_run: 'bool?'}
    max_attempts: 3
    alert: critical
    acts: true
  waiver-trigger:
    profile: core
    command: [python, -m, src.optimization.waiver_evaluator]
    params: {week: 'int?'}
    max_attempts: 3
    alert: critical
    acts: true
  # Each digest's signals start a run within minutes. The 21:45 slot stays, since emission has no
  # outbox, and settles the signals core holds for fresh VORP. The digest emits one event per
  # signal; debounce windows are fixed :00/:30 boundaries, so a burst usually starts one run (two
  # back to back if it crosses a boundary). `queue` makes the chain step and the 21:45 slot wait
  # for an event run still in flight instead of skipping as overlap. A run whose pod dies holds
  # the job for its deadline plus the watcher's 10m orphan grace: 15m + 10m stays under the
  # shortest wait (an event's 30m). Live runs take under 4s.
  rumor-action-trigger:
    profile: core
    command: [python, -m, src.services.rumor_action_service, --team-id, $(ESPN_TEAM_ID), --season, $(CURRENT_YEAR)]
    deadline: 15m
    max_attempts: 3
    overlap: queue
    acts: true
    schedules:
      - {cron: '45 21 * * *', tz: America/Chicago, catch_up: 1h}
    on_event:
      - {key: rumor.signal_created, debounce: 30m}
  # The trade jobs stay at one attempt: never auto-retry them.
  # Daily after the evening refresh, and again before the Wed/Fri scan. The 12:30 slot's two-minute
  # window plus the deadline keep even a late run clear of the 13:00 scan. The expensive
  # league-wide scoring is not replayed automatically.
  trade-candidates:
    profile: core
    command: [python, -m, src.jobs.trade_candidates]
    deadline: 25m
    schedules:
      - {cron: '0 7 * * *', tz: America/Chicago, catch_up: 1h}
      - {cron: '30 12 * * 3,5', tz: America/Chicago, catch_up: 2m}
  # Stages outgoing proposals for human review; a retry would generate a different pitch and
  # offer_key. Scheduled runs share a daily claim that manual runs skip, so the UI confirms them.
  # Trade sends are armed on the KEDA ScaledJob only: nothing here may set TRADE_DRY_RUN or
  # TRADE_SUBMIT_ENABLED, so scans keep dry-filling. The deadline sits above the CLI's 15m bound.
  trade-scan:
    profile: worker-scan
    command: [node, src/bots/trade_scan.js, --stage]
    deadline: 16m
    acts: true
    resources: {requests: {cpu: 50m, memory: 256Mi}, limits: {cpu: 1000m, memory: 1200Mi}}
    schedules:
      - {cron: '0 13 * * 3,5', tz: America/Chicago, catch_up: 30m}
  # Persists incoming offers for review and only reads ESPN. The deadline leaves startup headroom
  # above the CLI's ten-minute bound.
  trade-inbox:
    profile: worker
    command: [node, src/bots/trade_inbox.js, --refresh]
    deadline: 11m
    resources: {requests: {cpu: 50m, memory: 256Mi}, limits: {cpu: 1000m, memory: 1200Mi}}
    schedules:
      - {cron: '0 8-22/2 * * *', tz: America/Chicago, catch_up: 30m}
# Data steps need their parent's success. The refresh and the acting steps run once their parent
# finishes, so a failed ingestion still refreshes projections and still sets the lineup. `latest`
# keeps the old CronJob times as upper bounds. On Tuesday the standalone 18:00 and 21:45 slots
# are skipped (chain_step) while the chain covers them.
chains:
  tuesday-weekly:
    # 16:00 gives nflverse time to publish Monday night's data (docs/cronjob-schedule-order.md).
    schedule: {cron: '0 16 * * 2', tz: America/Chicago, catch_up: 2h, seasons: [regular]}
    max_duration: 8h
    steps:
      sync-league: {}
      metrics-extractor: {after: [{step: sync-league, on: success}]}
      sync-actual-scores: {after: [{step: metrics-extractor, on: success}]}
      projections-refresh: {after: [{step: sync-actual-scores, on: finish}]}
      lineup-optimizer: {after: [{step: projections-refresh, on: finish}], latest: '19:15'}
      waiver-trigger: {after: [{step: lineup-optimizer, on: finish}], latest: '20:30'}
      rumor-action-trigger: {after: [{step: waiver-trigger, on: finish}], latest: '21:45'}
