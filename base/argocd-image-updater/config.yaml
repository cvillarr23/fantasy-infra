apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-image-updater-config
  namespace: argocd
data:
  # Registry configuration for GHCR (GitHub Container Registry)
  # Credentials are pulled from a secret mounted at /home/argocd/.docker/config.json
  registries.conf: |
    registries:
    - name: ghcr
      prefix: ghcr.io
      api_url: https://ghcr.io
      ping: yes
      credentials: pullsecret:argocd/ghcr-pull-secret

  # Descriptive git commit title/body for write-back commits.
  # Source-commit titles from app repos are not available here; include app + image deltas instead.
  commit.template: |
    chore(images): update {{ .AppName }} images [argocd-image-updater]

    {{- range .AppChanges }}
    - {{ . }}
    {{- end }}
