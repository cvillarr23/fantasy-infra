apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-image-updater
  namespace: argocd
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: argocd-image-updater
  template:
    metadata:
      labels:
        app.kubernetes.io/name: argocd-image-updater
    spec:
      serviceAccountName: argocd-image-updater
      containers:
        - name: argocd-image-updater
          image: quay.io/argoprojlabs/argocd-image-updater:v0.12.2
          imagePullPolicy: Always
          command:
            - argocd-image-updater
            - run
          env:
            # Write-back configuration: commits digests directly to git
            - name: ARGOCD_IMAGE_UPDATER_KUSTOMIZE_V5
              value: "true"
            - name: ARGOCD_IMAGE_UPDATER_GIT_COMMIT_USER
              value: "argocd-image-updater"
            - name: ARGOCD_IMAGE_UPDATER_GIT_COMMIT_EMAIL
              value: "argocd-image-updater@argoproj.io"
            # Write-back target: fantasy-infra repo on main branch
            - name: ARGOCD_IMAGE_UPDATER_WRITE_BACK_METHOD
              value: "git"
            - name: ARGOCD_IMAGE_UPDATER_WRITE_BACK_TARGET
              value: "kustomization"
            # Log level
            - name: ARGOCD_IMAGE_UPDATER_LOG_LEVEL
              value: "info"
            # Health check endpoint
            - name: ARGOCD_IMAGE_UPDATER_HEALTH_PORT
              value: "8080"
          ports:
            - containerPort: 8080
              name: metrics
          volumeMounts:
            - name: config
              mountPath: /app/config
            - name: git-creds
              mountPath: /home/argocd/.ssh/id_rsa
              subPath: id_rsa
              readOnly: true
            - name: git-creds
              mountPath: /home/argocd/.ssh/id_rsa.pub
              subPath: id_rsa.pub
              readOnly: true
            - name: ssh-config
              mountPath: /home/argocd/.ssh/config
              subPath: config
              readOnly: true
            - name: ssh-known-hosts
              mountPath: /home/argocd/.ssh/known_hosts
              subPath: known_hosts
              readOnly: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: argocd-image-updater-config
        - name: git-creds
          secret:
            secretName: argocd-image-updater-git-credentials
            defaultMode: 0600
        - name: ssh-config
          configMap:
            name: argocd-image-updater-ssh-config
            defaultMode: 0644
        - name: ssh-known-hosts
          configMap:
            name: argocd-image-updater-ssh-config
            defaultMode: 0644
